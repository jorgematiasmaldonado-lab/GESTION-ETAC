<script>
'use strict';
/* =====================================================
   1. UTILIDADES GENERALES
   ===================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const h = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const MS = 86400000;
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES_C = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const DIAS_C = ['D','L','M','M','J','V','S'];
const GUARDIAS = ['A','B','C'];

function logoFallback(img, txt){ const s=document.createElement('span'); s.className='logo-txt'; s.textContent=txt; img.replaceWith(s); }

// Las fechas se guardan como texto 'AAAA-MM-DD' y se calculan en UTC para evitar problemas de horario.
const D = s => new Date(s + 'T00:00:00Z');
const iso = d => d.toISOString().slice(0, 10);
const addD = (s, n) => iso(new Date(D(s).getTime() + n * MS));
const diffD = (a, b) => Math.round((D(b) - D(a)) / MS); // días de a hasta b
const hoy = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; };
const fmt = s => s ? s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4) : '';
const mod = (a, n) => ((a % n) + n) % n;
function parseFecha(t){ // acepta dd/mm/aaaa, dd-mm-aa, aaaa-mm-dd y números de Excel
  if (t == null || t === '') return null;
  if (typeof t === 'number' && t > 20000 && t < 80000) return iso(new Date(Date.UTC(1899,11,30) + t*MS));
  t = String(t).trim();
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return valid(+m[1], +m[2], +m[3]);
  m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m){ let y=+m[3]; if (y<100) y+=2000; return valid(y, +m[2], +m[1]); }
  return null;
  function valid(y,mo,d){ const s=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const x=new Date(s+'T00:00:00Z'); return (!isNaN(x) && iso(x)===s) ? s : null; }
}
const minHM = m => { m = Math.round(m||0); const s = m<0?'-':''; m=Math.abs(m); return `${s}${Math.floor(m/60)} h ${m%60} min`; };
const hmToMin = t => { const [a,b] = String(t||'').split(':').map(Number); return isNaN(a)?null:a*60+(b||0); };
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-zñ0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const mayus = s => String(s||'').trim().replace(/\s+/g,' ').toUpperCase();
function inRange(f, a, b){ return f >= a && f <= b; }

/* =====================================================
   2. ALMACENAMIENTO (IndexedDB con respaldo en localStorage)
   ===================================================== */
const Store = {
  db: null,
  async open(){
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('etac_gestion_personal', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }catch(e){ this.db = null; }
  },
  async get(k){
    if (!this.db){ const v = localStorage.getItem('etac_'+k); return v ? JSON.parse(v) : null; }
    return new Promise((res, rej) => { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
  },
  async set(k, v){
    if (!this.db){ localStorage.setItem('etac_'+k, JSON.stringify(v)); return; }
    return new Promise((res, rej) => { const t = this.db.transaction('kv','readwrite'); t.objectStore('kv').put(v, k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });
  }
};
let DB = null;
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => Store.set('data', JSON.parse(JSON.stringify(DB))).catch(e => toast('Error al guardar: '+e.message,'e')), 150); }

/* =====================================================
   3. DATOS INICIALES
   Personal tomado de las planillas reales (Guardia A del
   cronograma de licencias, Guardias B y C de las planillas de
   asistencia). Los registros marcados "ejemplo" se borran con
   el botón "Borrar datos de ejemplo".
   ===================================================== */
const FERIADOS_INICIALES = [
  // 2026
  '2026-01-01','2026-02-16','2026-02-17','2026-03-23','2026-03-24','2026-04-02','2026-04-03','2026-05-01','2026-05-25',
  '2026-06-15','2026-06-20','2026-07-09','2026-07-10','2026-08-17','2026-10-12','2026-11-23','2026-12-08','2026-12-24','2026-12-25','2026-12-31',
  // 2027 (los mismos que usa el cronograma de licencias 26-27)
  '2027-01-01','2027-02-08','2027-02-09','2027-03-24','2027-03-26','2027-04-02','2027-05-25','2027-07-09','2027-12-08','2027-12-24','2027-12-25','2027-12-31'
];
const CODIGOS_INICIALES = [
  {sigla:'P', nombre:'Presente', color:'#dcfce7', texto:'#166534', tecla:'p'},
  {sigla:'FC', nombre:'Franco compensatorio', color:'#dbeafe', texto:'#1e40af', tecla:'f'},
  {sigla:'CM', nombre:'Carpeta médica', color:'#fee2e2', texto:'#991b1b', tecla:'c'},
  {sigla:'LA', nombre:'Licencia anual', color:'#ede9fe', texto:'#5b21b6', tecla:'l'},
  {sigla:'ART', nombre:'Accidente de trabajo (ART)', color:'#ffedd5', texto:'#9a3412', tecla:'a'},
  {sigla:'CG', nombre:'Cambio de guardia', color:'#fef9c3', texto:'#854d0e', tecla:'g'},
  {sigla:'PASIVA', nombre:'Guardia pasiva', color:'#e0f2fe', texto:'#075985', tecla:'s'},
  {sigla:'CAP', nombre:'Capacitación / taller', color:'#ccfbf1', texto:'#115e59', tecla:'t'},
  {sigla:'—', nombre:'No corresponde', color:'#f3f4f6', texto:'#6b7280', tecla:'-'}
];
const PERSONAL_INICIAL = {
  A: ['AGUIRRE JUAN PABLO','BARREIRO DAVID','BENDAYAN MICHELLE','CHAVARRIA GASPAR','COLAZO JUAN','CORDOBA GINES','DE ZOTTI MICAELA','LOPEZ MARIA EMILIA','MALDONADO ABIGAIL','MALDONADO JORGE','MOLINA IGNACIO','OLDRINI CAMILA','PAEZ MAYRA','PEREZ DIEGO','RECAMAN AGUSTIN','REYNOSO MARTIN','RIVERO GASTON','SENNO GUSTAVO','SILES DIEGO','VALDEZ SANTIAGO'],
  B: ['ABRATTE CRISTIAN','BATISTUTTA GABRIEL','BRANDAN FLOR','BRITOS VICENTE','CARRION ABIGAIL','GUDIÑO HUGO','HEREDIA CLAUDIO','ITURRES GABRIEL','MELIAN TOMAS','MERLOS LAURA','MINICUCCI CELESTE','OCHOA CHRISTIAN','ORDOÑEZ ARIEL','ORUE FRANCISCO','PEREYRA IGNACIO','PEREYRA JEREMÍAS','RAME GABRIEL','REYNA YAZMIN','RAMIREZ RODRIGO','SANCHEZ JULIAN','FERNANDEZ MATEO'],
  C: ['ACHAVAL FEDERICO','ALTURRIA MELISA','AMEZAGUE LUCIANA','CRUZ EZEQUIEL','DESTEFANI MAURICIO','DUTRA FERNANDO','GABELLINI JOAQUIN','GALFIONE TOMAS','LOPEZ MICAELA','LÓPEZ NATHALIE','MALDONADO JUAN','NOSEDA SERGIO','PERALTA MILAGROS','PETRUZZI LUCAS','PIZZOLATO GENARO','PRAT CELESTE','REYES DAFNE','REYES IVO','SASTRE JOEL','TABOADA VALERIA','CISTERNA ANTONELA','LOPEZ LEANDRO']
};
function datosIniciales(){
  const db = {
    version: 1,
    personal: [], asistencia: {}, horas: [], francos: [], licencias: [], capacitaciones: [],
    carpetas: [], cambios: [], novedades: [], importaciones: [],
    config: {
      institucion: 'ETAC - Equipo Técnico de Acción ante Catástrofes',
      rotacion: { A: '2026-11-02', B: '2026-11-03', C: '2026-11-04' },
      codigos: CODIGOS_INICIALES.map(c => ({...c})),
      feriados: [...FERIADOS_INICIALES],
      minPresentes: 12, maxLicencia: 3, ultimoBackup: null
    }
  };
  for (const g of GUARDIAS) PERSONAL_INICIAL[g].forEach(n => db.personal.push(nuevaPersona({nombre:n, guardia:g})));
  // --- Datos de ejemplo (borrables) ---
  const p = n => db.personal.find(x => x.nombre === n).id;
  const t = hoy();
  const ej = [
    [p('BATISTUTTA GABRIEL'), addD(t,-20), 'retiro', '08:00', '14:30', 'Traslado de paciente'],

function nuevaPersona(o){
  return { id: uid(), nombre: mayus(o.nombre), dni: o.dni||'', guardia: o.guardia||'A', cargo: o.cargo||'', tel: o.tel||'',
    ingreso: o.ingreso||'', activo: o.activo!==false, obs: o.obs||'', saldoInicialMin: o.saldoInicialMin||0,
    historialGuardia: [{guardia: o.guardia||'A', desde: '2000-01-01'}] };
}
const calcMin = (de, ha) => { const a = hmToMin(de), b = hmToMin(ha); if (a==null||b==null) return 0; let m = b - a; if (m <= 0) m += 1440; return m; };

   ===================================================== */
const persona = id => DB.personal.find(p => p.id === id);
const nombreP = id => persona(id)?.nombre || '(persona eliminada)';
const activos = () => DB.personal.filter(p => p.activo).sort((a,b)=>a.nombre.localeCompare(b.nombre));
const feriadoSet = () => new Set(DB.config.feriados);
const codigo = s => DB.config.codigos.find(c => c.sigla === s);

function guardiaEn(p, f){ // guardia de la persona en una fecha
  const hs = [...(p.historialGuardia||[])].sort((a,b)=>a.desde.localeCompare(b.desde));
  let g = hs.length ? hs[0].guardia : p.guardia;
  for (const x of hs) if (x.desde <= f) g = x.guardia;
  return g;
}
function fechasGuardia(g, y, m){ // fechas de la guardia g en el mes m (0-11) del año y
  const ref = DB.config.rotacion[g]; if (!ref) return [];
  const ini = `${y}-${String(m+1).padStart(2,'0')}-01`;
  let f = addD(ini, mod(-diffD(ref, ini), 3)); const out = [];
  while (f.slice(0,7) === ini.slice(0,7)){ out.push(f); f = addD(f,3); }
  return out;
}
function guardiaDelDia(f){ for (const g of GUARDIAS){ const r = DB.config.rotacion[g]; if (r && mod(diffD(r,f),3)===0) return g; } return null; }

function habiles(a, b, fer){ // días hábiles (lun-vie sin feriados) entre a y b inclusive
  if (!a || !b || b < a) return 0; fer = fer || feriadoSet(); let n = 0;
  for (let f = a; f <= b; f = addD(f,1)){ const d = D(f).getUTCDay(); if (d>0 && d<6 && !fer.has(f)) n++; }
  return n;
}
function saldo(pid){
  const p = persona(pid);
  const min = (p?.saldoInicialMin||0) + DB.horas.filter(x => x.personaId===pid && !x.anulado).reduce((s,x)=>s+x.min,0);
  const ganados = Math.floor(min/1440), tomados = DB.francos.filter(x=>x.personaId===pid).length;
  return { min, ganados, tomados, disp: ganados - tomados, resto: 1440 - mod(min,1440), avance: mod(min,1440) };
}
function licDe(lic){ const fer = feriadoSet(); const usados = lic.franjas.reduce((s,f)=>s+habiles(f.desde,f.hasta,fer),0); return {usados, restantes:(+lic.disponibles||0)-usados}; }
function licenciaEn(pid, f){ return DB.licencias.some(l => l.personaId===pid && l.franjas.some(x => inRange(f,x.desde,x.hasta))); }
const finCarpeta = c => addD(c.inicio, Math.max(1,+c.dias||1)-1);
function carpetaEn(pid, f){ return DB.carpetas.find(c => c.personaId===pid && inRange(f, c.inicio, finCarpeta(c))); }
const kAs = (pid, f) => pid + '|' + f;
function celda(pid, f){ // código efectivo de una casilla de asistencia
  const r = DB.asistencia[kAs(pid,f)];
  if (r && r.cod) return {...r};
  if (licenciaEn(pid,f)) return {cod:'LA', auto:true};
  if (carpetaEn(pid,f)) return {cod:'CM', sug:true};
  return {cod:''};
}
function periodos(){ const s = new Set([...DB.licencias.map(l=>l.periodo), ...(DB.config.periodosExtra||[])]); const y = new Date().getFullYear(); s.add(`${y}-${y+1}`); s.add(`${y-1}-${y}`); return [...s].sort().reverse(); }

function descargar(nombre, contenido, tipo){ const b = new Blob([contenido], {type:tipo}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); }
function exportCSV(nombre, filas){ const esc = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }; descargar(nombre, '﻿' + filas.map(r=>r.map(esc).join(';')).join('\r\n'), 'text/csv;charset=utf-8'); }
function tablaACSV(sel, nombre){ const t = document.querySelector(sel); if (!t) return; exportCSV(nombre, Array.from(t.querySelectorAll('tr')).map(tr=>Array.from(tr.children).filter(c=>!c.classList.contains('noprint')).map(c=>c.innerText.trim()))); }

async function borrarPersona(id){
  const n = DB.horas.filter(x=>x.personaId===id).length + DB.francos.filter(x=>x.personaId===id).length + DB.licencias.filter(x=>x.personaId===id).length + DB.carpetas.filter(x=>x.personaId===id).length;
  if (n && !(await confirmar(`Esta persona tiene ${n} registros. Si la eliminás se borran también. Para conservar el historial conviene marcarla como "Inactivo". ¿Eliminar igual?`))) return;
  if (!n && !(await confirmar('¿Eliminar esta persona?'))) return;
  DB.personal = DB.personal.filter(p=>p.id!==id);
  ['horas','francos','licencias','carpetas','cambios','novedades'].forEach(k => DB[k] = DB[k].filter(x=>x.personaId!==id));
  Object.keys(DB.asistencia).forEach(k=>{ if (k.startsWith(id+'|')) delete DB.asistencia[k]; });
  DB.capacitaciones.forEach(c=>delete c.asistentes[id]);
  save(); cerrarModal(); render();
}
function importarPersonal(){
  modal(`<h2>Importar personal</h2><p>Elegí un Excel o CSV con una columna <b>Apellido y nombre</b> y una columna <b>Guardia</b> (A, B o C). Opcionales: DNI, Cargo, Teléfono. Las personas que ya existen no se duplican.</p>
  <input type="file" id="fper" accept=".csv,.xlsx,.xls"><div id="perRes" style="margin-top:10px"></div>
  <div class="acc"><button class="btn" onclick="cerrarModal()">Cerrar</button><button class="btn p" onclick="procesarPersonal()">Importar</button></div>`);
}
async function procesarPersonal(){
  const f = $('#fper').files[0]; if (!f) return alert('Elegí un archivo');
  try{
    const filas = await leerTabla(f);
    const hi = filas.findIndex(r => r.some(c => /nombre|apellido|agente/.test(norm(c))));
    if (hi < 0) return $('#perRes').innerHTML = '<div class="err">No encontré la columna de apellido y nombre.</div>';
    const hd = filas[hi].map(norm), col = re => hd.findIndex(x=>re.test(x));
    const cN = col(/nombre|apellido|agente/), cG = col(/guardia/), cD = col(/dni|legajo/), cC = col(/cargo|jerarq/), cT = col(/tel/);
    let nuevos = 0, exist = 0;
    for (const r of filas.slice(hi+1)){
      const n = mayus(r[cN]); if (!n) continue;
      if (DB.personal.some(p => claveNombre(p.nombre)===claveNombre(n))){ exist++; continue; }
      const g = String(r[cG]||'').toUpperCase().replace(/GUARDIA|\s|"/g,'');
      DB.personal.push(nuevaPersona({nombre:n, guardia: GUARDIAS.includes(g)?g:'A', dni: cD>=0?String(r[cD]||''):'', cargo: cC>=0?String(r[cC]||''):'', tel: cT>=0?String(r[cT]||''):''}));
      nuevos++;
    }
    save(); render(); $('#perRes').innerHTML = `<div class="okbox">${nuevos} personas agregadas · ${exist} ya existían.</div>`;
  }catch(e){ $('#perRes').innerHTML = `<div class="err">${h(e.message)}</div>`; }
}

/* ---------- Ficha individual ---------- */
function ficha(id){
  const p = persona(id); const s = saldo(id); const t = hoy();
  const hs = DB.horas.filter(x=>x.personaId===id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const fr = DB.francos.filter(x=>x.personaId===id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const li = DB.licencias.filter(x=>x.personaId===id).sort((a,b)=>b.periodo.localeCompare(a.periodo));
  const ca = DB.carpetas.filter(x=>x.personaId===id).sort((a,b)=>b.inicio.localeCompare(a.inicio));
  const cp = DB.capacitaciones.filter(c=>c.asistentes[id]).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const y = t.slice(0,4), mth = t.slice(0,7);
  const diasCM = (pref) => ca.reduce((n,c)=>{ let k=0; for(let f=c.inicio; f<=finCarpeta(c); f=addD(f,1)) if (f.startsWith(pref)) k++; return n+k; },0);
  const asis = Object.entries(DB.asistencia).filter(([k])=>k.startsWith(id+'|')).map(([k,v])=>({f:k.split('|')[1], ...v})).filter(x=>x.f.startsWith(y));
  const cuenta = {}; asis.forEach(a=>cuenta[a.cod]=(cuenta[a.cod]||0)+1);
  const horasCap = cp.filter(c=>['asistio','aprobado'].includes(c.asistentes[id])).reduce((n,c)=>n+(+c.horas||0),0);
  document.body.classList.add('modal-print');
  modal(`${printHead('Ficha individual')}
  <div class="row" style="justify-content:space-between"><h2 style="margin:0">${h(p.nombre)}</h2><div class="noprint"><button class="btn s" onclick="cerrarModal();editarPersona('${id}')">Editar datos</button> <button class="btn s d" onclick="imprimir()">Imprimir ficha</button> <button class="btn s" onclick="cerrarModal()">Cerrar</button></div></div>
  <p>Guardia <b>${p.guardia}</b> · ${h(p.cargo)||'Sin cargo'} · DNI/Legajo: ${h(p.dni)||'—'} · Tel: ${h(p.tel)||'—'} · Ingreso: ${fmt(p.ingreso)||'—'} · ${p.activo?'Activo':'Inactivo'}</p>
  ${p.obs?`<p class="muted">${h(p.obs)}</p>`:''}
  <div class="grid g4">
    <div class="stat"><div class="n">${minHM(s.min)}</div><div class="l">Horas extras acumuladas${p.saldoInicialMin?` (incluye ${minHM(p.saldoInicialMin)} de saldo inicial)`:''}</div></div>
    <div class="stat v"><div class="n">${s.disp}</div><div class="l">Francos disponibles (${s.ganados} ganados − ${s.tomados} tomados)</div></div>
    <div class="stat a"><div class="n">${minHM(s.resto)}</div><div class="l">Faltan para el próximo franco</div><div class="bar ${s.avance>=1200?'ok':''}"><div style="width:${s.avance/14.4}%"></div></div></div>
    <div class="stat r"><div class="n">${diasCM(mth)} / ${diasCM(y)}</div><div class="l">Días de carpeta médica (mes / año)</div></div>
  </div>
  <h3>Asistencia ${y}</h3><div>${Object.keys(cuenta).length?Object.entries(cuenta).map(([k,v])=>`<span class="tag" style="margin:2px">${h(k)}: ${v}</span>`).join(''):'<span class="muted">Sin registros.</span>'}</div>
  <h3>Formularios de horas extras (suman al saldo)</h3>
  ${hs.length?`<div class="tbl-wrap"><table class="tbl"><tr><th>Fecha</th><th>Tipo</th><th>Horario</th><th class="num">Tiempo</th><th>Motivo</th><th>N.º form.</th></tr>${hs.map(x=>`<tr class="${x.anulado?'anul':''}"><td>${fmt(x.fecha)}</td><td>${tipoHora(x.tipo)}</td><td>${x.desde} a ${x.hasta}</td><td class="num">${minHM(x.min)}</td><td>${h(x.motivo)}${x.anulado?` (ANULADO: ${h(x.motivoAnulacion)})`:''}</td><td>${h(x.nroForm)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Sin formularios.</p>'}
  <h3>Francos compensatorios tomados</h3>${fr.length?`<p>${fr.map(x=>`${fmt(x.fecha)}${x.forzado?' (forzado)':''}`).join(' · ')}</p>`:'<p class="muted">Ninguno.</p>'}
  <h3>Licencia anual</h3>${li.length?li.map(l=>{const c=licDe(l); return `<p><b>${h(l.periodo)}</b>: ${l.disponibles} disponibles · ${c.usados} usados · <b>${c.restantes} restantes</b><br>${l.franjas.map((f,i)=>`${i+1}.ª franja: ${fmt(f.desde)} – ${fmt(f.hasta)}`).join(' · ')}</p>`;}).join(''):'<p class="muted">Sin licencias cargadas.</p>'}
  <h3>Carpetas médicas</h3>${ca.length?`<div class="tbl-wrap"><table class="tbl"><tr><th>Desde</th><th>Hasta</th><th class="num">Días</th><th>Tipo</th><th>Certificado</th></tr>${ca.map(c=>`<tr><td>${fmt(c.inicio)}</td><td>${fmt(finCarpeta(c))}</td><td class="num">${c.dias}</td><td>${h(c.tipo)}</td><td>${c.presento?'Presentado':'<span class="tag r">Pendiente</span>'} ${h(c.nroCert)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Ninguna.</p>'}

/* =====================================================
   8. VISTA: ASISTENCIA (planilla mensual por guardia)
   ===================================================== */
function abrirAsistencia(g, f){ UI.asis = {g, y:+f.slice(0,4), m:+f.slice(5,7)-1}; ir('asistencia'); }
function vAsistencia(){
  if (!UI.asis){ const t = hoy(); UI.asis = {g: guardiaDelDia(t)||'A', y:+t.slice(0,4), m:+t.slice(5,7)-1}; }
  const {g,y,m} = UI.asis;
  const fechas = fechasGuardia(g,y,m);
  const per = DB.personal.filter(p => fechas.some(f=>guardiaEn(p,f)===g) && (p.activo || fechas.some(f=>DB.asistencia[kAs(p.id,f)]))).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const cods = DB.config.codigos;
  const tot = {}; fechas.forEach(f=>tot[f]=0);
  const filas = per.map((p,i) => {
    const cnt = {};
    const tds = fechas.map(f => {
      if (guardiaEn(p,f)!==g) return `<td><button class="cel nc" disabled>×</button></td>`;
      const c = celda(p.id,f); const cd = codigo(c.cod);
      if (c.cod && !c.sug){ cnt[c.cod]=(cnt[c.cod]||0)+1; if (c.cod==='P') tot[f]++; }
      const style = cd && c.cod ? `background:${cd.color};color:${cd.texto}` : '';
      const tip = [cd?.nombre, c.auto?'(automático por licencia)':'', c.sug?'(sugerido: tiene carpeta médica)':'', c.nota, c.conId?'con '+nombreP(c.conId):''].filter(Boolean).join(' – ');
      return `<td><button class="cel ${c.auto?'auto':''} ${c.sug?'sug':''}" style="${style}" data-p="${p.id}" data-f="${f}" title="${h(tip)}">${h(c.cod)}${c.sug?'?':''}${c.nota||c.conId?'<span class="dot"></span>':''}</button></td>`;
    }).join('');
    return `<tr><td class="nro">${i+1}</td><td class="nom">${h(p.nombre)}</td>${tds}<td class="tot">${Object.entries(cnt).map(([k,v])=>`${k}:${v}`).join(' ')}</td></tr>`;
  }).join('');
  const minP = +DB.config.minPresentes||0;
  return `<h1 class="noprint">Asistencia por guardia</h1>
  <div class="card noprint"><div class="row">
    <div><label>Guardia</label><select onchange="UI.asis.g=this.value;render()">${optG(g)}</select></div>
    <div><label>Mes</label><select onchange="UI.asis.m=+this.value;render()">${MESES.map((x,i)=>`<option value="${i}" ${i===m?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>Año</label><input type="number" style="width:100px" value="${y}" onchange="UI.asis.y=+this.value;render()"></div>
    <button class="btn" onclick="moverMes(-1)">◀ Mes anterior</button><button class="btn" onclick="moverMes(1)">Mes siguiente ▶</button>
    <button class="btn" onclick="tablaACSV('#plan','asistencia_${MESES[m]}_${y}_G${g}.csv')">Exportar CSV</button>
    <button class="btn d" onclick="imprimir()">Imprimir planilla</button>
  </div>
  <p class="muted" style="margin:10px 0 0">Hacé clic en una casilla o usá el teclado: ${cods.filter(c=>c.tecla).map(c=>`<b>${h(c.tecla.toUpperCase())}</b>=${h(c.sigla)}`).join(' · ')} · <b>Supr</b>=borrar · <b>Enter</b>=detalle (nota, cambio de guardia) · flechas para moverse.</p></div>
  ${printHead('')}
  <h2 style="text-align:center;margin-top:0">${MESES[m].toUpperCase()} ${y} - GUARDIA "${g}"</h2>
  ${per.length?`<div class="tbl-wrap" style="max-height:72vh"><table class="plan" id="plan">
    <thead><tr><th>#</th><th style="text-align:left;position:sticky;left:0;z-index:3">APELLIDO NOMBRE</th>${fechas.map(f=>`<th>${+f.slice(8)} ${MES_C[m]}<br><span style="font-weight:400">${['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][D(f).getUTCDay()]}</span></th>`).join('')}<th>Totales</th></tr>
    <tr class="noprint"><th></th><th style="position:sticky;left:0;z-index:3"></th>${fechas.map(f=>`<th><button class="btn s" style="font-size:11px;padding:2px 5px" onclick="todosPresentes('${f}')">Todos P</button></th>`).join('')}<th></th></tr></thead>
    <tbody>${filas}</tbody>
    <tfoot><tr><td></td><td class="nom">Presentes</td>${fechas.map(f=>`<td class="${tot[f]&&tot[f]<minP?'bajo':''}" title="${tot[f]&&tot[f]<minP?'Menos del mínimo configurado ('+minP+')':''}">${tot[f]}</td>`).join('')}<td></td></tr></tfoot>
  </table></div>`:'<div class="warn">No hay personal en esta guardia.</div>'}
  <div class="leyenda" style="margin-top:10px">${cods.map(c=>`<span><b style="background:${c.color};color:${c.texto}">${h(c.sigla)}</b>${h(c.nombre)}</span>`).join('')}<span class="muted">· En cursiva: completado automáticamente por licencia (LA) o sugerido por carpeta médica (CM?).</span></div>
  ${printFoot()}`;
}
function moverMes(d){ let {y,m} = UI.asis; m += d; if (m<0){m=11;y--;} if (m>11){m=0;y++;} UI.asis.y=y; UI.asis.m=m; render(); }
function initGrilla(){
  const plan = $('#plan'); if (!plan) return;
  plan.addEventListener('click', e => { const b = e.target.closest('.cel'); if (b && !b.disabled) detalleCelda(b.dataset.p, b.dataset.f); });
  plan.addEventListener('keydown', async e => {
    const b = e.target.closest('.cel'); if (!b || b.disabled) return;
    const cells = $$('#plan .cel'); const cols = $$('#plan thead tr:first-child th').length - 3;
    const i = cells.indexOf(b);
    const mv = {ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols}[e.key];
    if (mv){ e.preventDefault(); const n = cells[i+mv]; if (n) n.focus(); return; }
    if (e.key==='Enter'){ e.preventDefault(); detalleCelda(b.dataset.p, b.dataset.f); return; }
    if (e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); await setCodigo(b.dataset.p, b.dataset.f, ''); refocus(i); return; }
    const c = DB.config.codigos.find(c => c.tecla && c.tecla.toLowerCase()===e.key.toLowerCase());
    if (c && !e.ctrlKey && !e.metaKey){ e.preventDefault(); await setCodigo(b.dataset.p, b.dataset.f, c.sigla); if (c.sigla==='CG') detalleCelda(b.dataset.p,b.dataset.f); else refocus(i+cols); }
  });
}
function refocus(i){ const c = $$('#plan .cel'); (c[i] || c[c.length-1])?.focus(); }
async function setCodigo(pid, f, cod, extra = {}){
  const k = kAs(pid,f); const prev = DB.asistencia[k] || {};
  if (prev.cod==='FC' && cod!=='FC'){ DB.francos = DB.francos.filter(x => x.origen !== k); }
  if (cod==='FC' && prev.cod!=='FC'){
    const s = saldo(pid); let forz = false, just = '';
    if (s.disp < 1){
      just = await confirmar(`${nombreP(pid)} no tiene francos disponibles (le faltan ${minHM(s.resto)} para el próximo). ¿Registrar el franco igual?`, true);
      if (!just) return false; forz = true;
    }
    DB.francos.push({id:uid(), personaId:pid, fecha:f, obs:'Cargado desde la planilla de asistencia', forzado:forz, justif:just, origen:k});
  }
  if (cod==='CG' || prev.cod==='CG'){ DB.cambios = DB.cambios.filter(c => c.origen !== k); }
  if (!cod){ delete DB.asistencia[k]; }
  else {
    DB.asistencia[k] = {cod, nota: extra.nota ?? (prev.cod===cod?prev.nota:'') ?? '', conId: extra.conId ?? (cod==='CG'?prev.conId:'') ?? ''};
    if (cod==='CG' && DB.asistencia[k].conId) DB.cambios.push({id:uid(), personaId:pid, conId:DB.asistencia[k].conId, fecha:f, devolucion:extra.devolucion||'', devuelto:!!extra.devuelto, origen:k});
  }
  save(); render();
  if (cod==='CM' && !carpetaEn(pid,f)) toast(`${nombreP(pid)} figura con CM el ${fmt(f)} pero no tiene carpeta médica cargada.`, '', ['Cargar carpeta médica', ()=>editarCarpeta(null, {personaId:pid, inicio:f})]);
  return true;
}
function detalleCelda(pid, f){
  const c = celda(pid,f); const r = DB.asistencia[kAs(pid,f)] || {};
  const cb = DB.cambios.find(x=>x.origen===kAs(pid,f)) || {};
  modal(`<h2>${h(nombreP(pid))} – ${fmt(f)}</h2>
  ${c.auto?'<div class="warn">Tiene licencia anual cargada para esta fecha (LA automático). Si elegís otro código, se reemplaza solo en la planilla.</div>':''}
  ${c.sug?'<div class="warn">Tiene una carpeta médica que abarca esta fecha.</div>':''}
  <div class="codes">${DB.config.codigos.map(x=>`<button class="btn" style="background:${x.color};color:${x.texto};${r.cod===x.sigla?'outline:3px solid #111':''}" onclick="elegirCod('${h(x.sigla)}')">${h(x.sigla)}<br><span style="font-size:11px;font-weight:400">${h(x.nombre)}</span></button>`).join('')}
  <button class="btn" onclick="elegirCod('')">Borrar</button></div>
  <input type="hidden" id="dcCod" value="${h(r.cod||'')}">
  <div class="f" style="margin-top:10px"><label>Nota corta (opcional)</label><input id="dcNota" value="${h(r.nota||'')}" placeholder="Ej.: Taller, salió 10:00…"></div>
  <fieldset style="border:1px solid #ddd;border-radius:8px"><legend><b>Cambio de guardia (CG)</b></legend>
    <div class="grid g2"><div class="f"><label>Se cambió con</label><select id="dcCon"><option value="">—</option>${optPersonas(r.conId||'')}</select></div>
    <div class="f"><label>Fecha en que devuelve la guardia</label><input type="date" id="dcDev" value="${h(cb.devolucion||'')}"></div></div>
    <label><input type="checkbox" id="dcDevu" ${cb.devuelto?'checked':''}> Ya la devolvió</label></fieldset>
  <div class="acc"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn p" onclick="guardarCelda('${pid}','${f}')">Guardar</button></div>`);
  window.elegirCod = cod => { $('#dcCod').value = cod; $$('.codes .btn').forEach(b=>b.style.outline=''); const b = $$('.codes .btn').find(b=>b.firstChild.textContent===cod); if (b) b.style.outline='3px solid #111'; if (cod!=='CG') guardarCelda(pid,f); };
}
async function guardarCelda(pid, f){
  const cod = val('dcCod'), nota = val('dcNota').trim(), conId = val('dcCon'), devolucion = val('dcDev'), devuelto = $('#dcDevu').checked;
  cerrarModal();
  await setCodigo(pid, f, cod, {nota, conId: cod==='CG'?conId:'', devolucion, devuelto});
}
async function todosPresentes(f){
  const {g} = UI.asis; let n = 0;
  DB.personal.filter(p=>p.activo && guardiaEn(p,f)===g).forEach(p => { if (!celda(p.id,f).cod){ DB.asistencia[kAs(p.id,f)] = {cod:'P', nota:''}; n++; } });
  save(); render(); toast(`${n} personas marcadas presentes el ${fmt(f)}. Corregí solo las excepciones.`,'ok');
}

function alertasLic(l){

    DB.licencias.filter(o=>o.id!==l.id && o.personaId===l.personaId).forEach(o=>o.franjas.forEach(g=>{ if (f.desde<=g.hasta && g.desde<=f.hasta) out.push(`Se superpone con otra licencia (${o.periodo})`); }));

const cargados = {};
function cargarLib(url){
  if (cargados[url]) return cargados[url];
  return cargados[url] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = url; s.onload = res; s.onerror = () => { delete cargados[url]; rej(new Error('No se pudo cargar una librería necesaria. Revisá la conexión a internet (solo hace falta para importar Excel o PDF; los CSV funcionan sin internet).')); }; document.head.appendChild(s); });
}
function parseCSV(txt){
  txt = txt.replace(/^﻿/,''); const pl = txt.split(/\r?\n/)[0] || '';
  const sep = (pl.match(/;/g)||[]).length >= (pl.match(/,/g)||[]).length ? ';' : (pl.includes('\t')?'\t':',');
  const rows = []; let r = [], c = '', q = false;
  for (let i=0;i<txt.length;i++){ const ch = txt[i];
    if (q){ if (ch==='"'){ if (txt[i+1]==='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if (ch==='"') q = true; else if (ch===sep){ r.push(c); c=''; } else if (ch==='\n'){ r.push(c.replace(/\r$/,'')); rows.push(r); r=[]; c=''; } else c+=ch; }
  if (c || r.length){ r.push(c); rows.push(r); }
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
async function leerTabla(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext==='csv' || ext==='txt') return parseCSV(await file.text());
  await cargarLib(LIBS.xlsx);
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:false});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''}).filter(r=>r.some(x=>String(x).trim()));
}

const estadoImp = (html) => { const e = $('#impEstado'); if (e) e.innerHTML = html; };
async function procesarArchivo(file){
  const periodo = val('impPer').trim() || UI.licPeriodo;
  const ext = file.name.split('.').pop().toLowerCase();
  try{
    if (ext==='pdf'){ estadoImp('<div class="warn">Leyendo PDF…</div>'); const filas = await leerPDF(file); vistaPrevia(filas, file.name, periodo); }
    else { estadoImp('<div class="warn">Leyendo archivo…</div>'); const t = await leerTabla(file); mapeoColumnas(t, file.name, periodo); }
  }catch(e){ console.error(e); estadoImp(`<div class="err">${h(e.message)}</div>`); }
}
// --- Reconocimiento de columnas ---
const ROLES = [
  ['', '(ignorar)'], ['nombre','Apellido y nombre'], ['dni','DNI / Legajo'], ['disp','Días disponibles'], ['usados','Días usados'], ['rest','Días restantes'],
  ['franja','Franja (inicio - fin)'], ['desde','Fecha desde'], ['hasta','Fecha hasta'], ['periodo','Período / Año']
];
function rolDe(enc){
  const e = norm(enc);
  if (!e) return '';
  if (/franja|periodo de licencia|fechas/.test(e)){
    if (/desde/.test(e) || (/inicio/.test(e) && !/fin/.test(e))) return 'desde';
    if (/hasta/.test(e) || (/fin/.test(e) && !/inicio/.test(e))) return 'hasta';
    return 'franja';
  }
  if (/^(desde|inicio|fecha desde|fecha inicio)/.test(e) || /desde/.test(e)) return 'desde';
  if (/^(hasta|fin|fecha hasta|fecha fin)/.test(e) || /hasta/.test(e)) return 'hasta';
  if (/apellido|nombre|agente|efectivo/.test(e)) return 'nombre';
  if (/dni|legajo|documento/.test(e)) return 'dni';
  if (/restante|pendiente|saldo/.test(e)) return 'rest';
  if (/usad|tomad|gozad/.test(e)) return 'usados';
  if (/disponible|corresponde|dias|total/.test(e)) return 'disp';
  if (/ano|periodo/.test(e)) return 'periodo';
  return '';
}
function mapeoColumnas(tabla, archivo, periodo){
  let hi = tabla.slice(0,15).findIndex(r => r.filter(c=>rolDe(c)).length >= 2); if (hi < 0) hi = 0;
  const enc = tabla[hi].map(String); const roles = enc.map(rolDe);
  window._map = {tabla, hi, archivo, periodo};
  estadoImp(`<div class="card"><h3 style="margin-top:0">Columnas encontradas en "${h(archivo)}"</h3><p class="muted">Revisá qué es cada columna. Si alguna no se reconoció, elegila en la lista.</p>
  <div class="tbl-wrap"><table class="tbl"><tr>${enc.map((e,i)=>`<th>${h(e)||'(sin título)'}<br><select id="map${i}" style="font-size:13px;padding:3px">${ROLES.map(([k,t])=>`<option value="${k}" ${k===roles[i]?'selected':''}>${t}</option>`).join('')}</select></th>`).join('')}</tr>
  ${tabla.slice(hi+1, hi+4).map(r=>`<tr>${enc.map((_,i)=>`<td>${h(r[i])}</td>`).join('')}</tr>`).join('')}</table></div>
  <button class="btn p" style="margin-top:10px" onclick="aplicarMapeo()">Continuar a la vista previa</button></div>`);
}
function aplicarMapeo(){
  const {tabla, hi, archivo, periodo} = _map; const n = tabla[hi].length;
  const roles = Array.from({length:n},(_,i)=>val('map'+i));
  if (!roles.includes('nombre')) return alert('Indicá cuál es la columna de apellido y nombre');
  const filas = [];
  for (const r of tabla.slice(hi+1)){
    const o = {nombre:'', dni:'', disp:null, usados:null, rest:null, franjas:[], periodo:''}; const ds=[], hs=[];
    roles.forEach((rol,i)=>{ const v = r[i];
      if (rol==='nombre') o.nombre += ' ' + String(v||'');
      else if (rol==='dni') o.dni = String(v||'').trim();
      else if (['disp','usados','rest'].includes(rol)){ const x = parseFloat(String(v).replace(',','.')); if (!isNaN(x)) o[rol] = x; }
      else if (rol==='franja') o.franjas.push(...franjasDeTexto(v));
      else if (rol==='desde') ds.push(parseFecha(v)); else if (rol==='hasta') hs.push(parseFecha(v));
      else if (rol==='periodo') o.periodo = String(v||'').trim();
    });
    ds.forEach((d,i)=>{ if (d && hs[i]) o.franjas.push({desde:d, hasta:hs[i]}); });
    o.nombre = o.nombre.replace(/\s+/g,' ').trim();
    if (!o.nombre || /apellido|nombre/i.test(o.nombre) && o.disp==null) continue;
    filas.push(o);
  }
  vistaPrevia(filas, archivo, periodo);
}
function franjasDeTexto(t){
  if (typeof t === 'number') return [];
  const fs = (String(t||'').match(/\d{1,2}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*\d{2,4}/g) || []).map(x=>parseFecha(x.replace(/\s/g,''))).filter(Boolean);
  const out = []; for (let i=0;i+1<fs.length;i+=2) out.push({desde:fs[i], hasta:fs[i+1]}); return out;
}
// --- Lectura de PDF (texto o, si es imagen, OCR) ---
async function leerPDF(file){
  await cargarLib(LIBS.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let palabras = [], texto = 0;
  for (let n=1; n<=pdf.numPages; n++){
    const pg = await pdf.getPage(n); const vp = pg.getViewport({scale:1}); const tc = await pg.getTextContent();
    tc.items.forEach(it => { if (!it.str.trim()) return; texto += it.str.trim().length; palabras.push({t:it.str, x:it.transform[4], y:vp.height - it.transform[5], w:it.width, page:n, W:vp.width}); });
  }
  let ocr = false;
  if (texto < 40){
    const ok = await confirmar(`El PDF "${file.name}" no tiene texto (es una imagen). ¿Leerlo con reconocimiento de texto (OCR)? Puede tardar 1 o 2 minutos y necesita internet la primera vez.`);
    if (!ok) throw new Error('Importación cancelada. Si podés, exportá el cronograma a Excel o CSV.');
    palabras = await ocrPDF(pdf); ocr = true;
  }
  const filas = filasDesdePalabras(palabras);
  filas.forEach(f=>f.ocr = ocr);
  if (!filas.length) throw new Error('No encontré filas de licencias en el PDF. Probá exportarlo a Excel o CSV.');
  return filas;
}
async function ocrPDF(pdf){
  await cargarLib(LIBS.ocr);
  const worker = await Tesseract.createWorker('spa', 1, { logger: m => { if (m.status==='recognizing text') estadoImp(`<div class="warn">Reconociendo texto (OCR)… página ${window._ocrPag||1} de ${pdf.numPages}: ${Math.round(m.progress*100)}%</div>`); } });
  await worker.setParameters({ preserve_interword_spaces: '1' });
  const palabras = [];
  for (let n=1; n<=pdf.numPages; n++){
    window._ocrPag = n;
    const pg = await pdf.getPage(n); const vp = pg.getViewport({scale:2.5});
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await pg.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    const {data} = await worker.recognize(cv);
    (data.words||[]).forEach(w => { if (w.text.trim()) palabras.push({t:w.text, x:w.bbox.x0, y:(w.bbox.y0+w.bbox.y1)/2, w:w.bbox.x1-w.bbox.x0, page:n, W:vp.width}); });
  }
  await worker.terminate();
  return palabras;
}
/* Reconstruye la tabla a partir de la posición de cada palabra:
   1) ubica los encabezados (DISPONIBLES, USADOS, RESTANTES, FRANJA) para saber dónde empieza cada columna;
   2) cada número en la columna "Días disponibles" marca una fila;
   3) cada palabra se asigna a la fila más cercana y a su columna. Así se arman nombres y fechas cortados en dos renglones. */
function filasDesdePalabras(ws){
  const pags = [...new Set(ws.map(w=>w.page))].sort((a,b)=>a-b);
  let cols = null; const filas = [];
  for (const pg of pags){
    const P = ws.filter(w=>w.page===pg);
    const fh = re => P.filter(w=>re.test(norm(w.t)));
    const disp = fh(/disponible/)[0], us = fh(/usado/)[0], re = fh(/restante/)[0], fr = fh(/franja/).sort((a,b)=>a.x-b.x);
    let headY = -Infinity;
    if (disp && us && re){
      const W = P[0].W, tol = W*0.015;
      // Las fechas empiezan donde dice "1ª"/"2ª", un poco antes de la palabra FRANJA
      const c3 = fr[0] ? Math.max(re.x + W*0.05, fr[0].x - W*0.04) : re.x + W*0.1;
      const c4 = fr[1] ? fr[1].x - W*0.04 : W;
      cols = [disp.x-tol, us.x-tol, re.x-tol, c3, c4];
      headY = Math.max(disp.y, us.y, re.y, ...(fr.map(f=>f.y)));
    }
    if (!cols) continue;
    const colDe = w => { let c = 0; cols.forEach((x,i)=>{ if (w.x >= x) c = i+1; }); return c; }; // 0 nombre,1 disp,2 usados,3 rest,4 franja1,5 franja2
    const cuerpo = P.filter(w=>w.y > headY + 2 && !/^(apellido|nombre|dias|y|\(inicio|inicio|fin\)|-?\s*fin\)?)$/.test(norm(w.t)) && !/^file|cronograma|listado de efectivos/i.test(w.t));
    const anclas = cuerpo.filter(w=>colDe(w)===1 && /^\d{1,3}$/.test(w.t.trim())).sort((a,b)=>a.y-b.y);
    if (!anclas.length) continue;
    const esp = anclas.length>1 ? anclas.slice(1).map((a,i)=>a.y-anclas[i].y).sort((a,b)=>a-b)[Math.floor((anclas.length-1)/2)] : 60;
    const grupos = anclas.map(a=>({a, ws:[]}));
    cuerpo.forEach(w => { let best=null, bd=Infinity; grupos.forEach(g=>{ const d=Math.abs(w.y-g.a.y); if (d<bd){bd=d;best=g;} }); if (best && bd <= esp*0.62) best.ws.push(w); });
    for (const g of grupos){
      const por = [[],[],[],[],[],[]]; g.ws.forEach(w=>por[colDe(w)].push(w));
      const txt = arr => arr.sort((a,b)=> (Math.abs(a.y-b.y)<6 ? a.x-b.x : a.y-b.y)).map(w=>w.t).join(' ');
      const num = arr => { const m = txt(arr).match(/\d{1,3}/); return m ? +m[0] : null; };
      // limpia el nombre: solo letras, y quita letras sueltas que deja el OCR al principio o al final
      const nombre = txt(por[0]).replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ' ]/g,' ').replace(/\s+/g,' ').trim().replace(/^(\S\s)+/,'').replace(/(\s\S)+$/,'');
      if (!nombre) continue;
      filas.push({ nombre, dni:'', disp: num(por[1]), usados: num(por[2]), rest: num(por[3]), franjas: [...franjasDeTexto(txt(por[4])), ...franjasDeTexto(txt(por[5]))], periodo:'' });
    }
  }
  if (!filas.length){ // Plan B: buscar renglones con el patrón nombre + 3 números + fechas
    const lineas = {}; ws.forEach(w=>{ const k = w.page+'_'+Math.round(w.y/8); (lineas[k]=lineas[k]||[]).push(w); });
    Object.values(lineas).forEach(l=>{ const t = l.sort((a,b)=>a.x-b.x).map(w=>w.t).join(' ');
      const m = t.match(/^([A-Za-zÁÉÍÓÚÑáéíóúñ' .]+?)\s+(\d{1,3})\s+(\d{1,3})\s+(\d{1,3})\s+(.*)$/);
      if (m) filas.push({nombre:m[1].trim(), dni:'', disp:+m[2], usados:+m[3], rest:+m[4], franjas:franjasDeTexto(m[5]), periodo:''}); });
  }
  return filas;
}
// --- Cruce con el personal ---
const claveNombre = s => norm(s).split(' ').filter(Boolean).sort().join(' ');
function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function cruzar(o){
  if (o.dni){ const p = DB.personal.find(p=>p.dni && norm(p.dni)===norm(o.dni)); if (p) return {estado:'ok', pid:p.id}; }
  const k = claveNombre(o.nombre);
  const ex = DB.personal.filter(p=>claveNombre(p.nombre)===k);
  if (ex.length===1) return {estado:'ok', pid:ex[0].id};
  const tk = k.split(' ');
  const cands = DB.personal.map(p=>{
    const pk = claveNombre(p.nombre).split(' ');
    let hit = 0; tk.forEach(t=>{ if (pk.some(x=>x===t || (t.length>=1 && x.startsWith(t)) || (x.length>=1 && t.startsWith(x)) || (t.length>3 && x.length>3 && lev(t,x)<=1))) hit++; });
    const sc = hit / Math.max(tk.length, pk.length);
    return {p, sc};
  }).filter(c=>c.sc>=0.5).sort((a,b)=>b.sc-a.sc);
  if (cands.length) return {estado:'posible', pid:cands[0].p.id, cands:cands.slice(0,4).map(c=>c.p.id)};
  return {estado:'no', pid:''};
}
function vistaPrevia(filas, archivo, periodo){
  const items = filas.map((o,i)=>{
    const c = cruzar(o);
    const it = {...o, i, ...c, accion: c.estado==='no'?'nueva':'importar', guardia: 'A', periodo: o.periodo || periodo};
    return it;
  });
  window._imp = {items, archivo, periodo};
  dibujarPrevia();
}
function chequeos(it){
  const fer = feriadoSet(); const out = [];
  const calc = it.franjas.reduce((s,f)=>s+habiles(f.desde,f.hasta,fer),0); it.calc = calc;
  if (it.disp==null) out.push('Falta días disponibles');
  if (it.disp!=null && it.usados!=null && it.rest!=null && it.usados + it.rest !== it.disp) out.push(`Usados + restantes (${it.usados+it.rest}) ≠ disponibles (${it.disp})`);
  if (it.usados!=null && calc !== it.usados) out.push(`Las franjas suman ${calc} días hábiles y el archivo dice ${it.usados} usados`);
  it.franjas.forEach((f,j)=>{ if (!f.desde||!f.hasta) out.push(`Franja ${j+1} con fecha inválida`); else if (f.hasta<f.desde) out.push(`Franja ${j+1}: el fin es anterior al inicio`); });
  if (!it.franjas.length) out.push('Sin franjas de licencia');
  return out;
}
function dibujarPrevia(){
  const {items, archivo} = _imp; let v=0,a=0,r=0;

    const ch = chequeos(it);
    const prev = items.slice(0,idx).find(x=>x.pid && x.pid===it.pid && x.accion==='importar');
    let col = it.accion==='descartar' ? '' : (it.accion==='nueva' || !it.pid) ? 'r' : (it.estado==='posible' || ch.length || it.ocr) ? 'a' : 'v';
    if (it.accion==='nueva' && it.nombre) col = 'r';
    if (col==='v') v++; else if (col==='a') a++; else if (col==='r') r++;
    const est = {v:'✅ OK', a:'⚠️ Revisar', r:'❌ No encontrada', '':'Descartada'}[col];
    const notas = [...(it.estado==='posible'&&it.accion==='importar'?['Posible coincidencia: confirmá la persona']:[]), ...(it.ocr?['Leído por OCR']:[]), ...(prev?['Continuación de la fila anterior de la misma persona (se suma a su licencia)']:[]), ...ch];
    return `<tr style="background:${{v:'#f0fdf4',a:'#fefce8',r:'#fef2f2','':'#f3f4f6'}[col]}">
      <td><span class="tag ${col}">${est}</span></td>
      <td><b>${h(it.nombre)}</b>${it.dni?`<br><small>${h(it.dni)}</small>`:''}</td>
      <td><select onchange="impSet(${idx},'sel',this.value)" style="max-width:260px">
        <option value="__nueva" ${it.accion==='nueva'?'selected':''}>➕ Dar de alta como nueva</option>
        <option value="__desc" ${it.accion==='descartar'?'selected':''}>🗑 Descartar fila</option>
        ${(it.cands||[]).length?`<optgroup label="Posibles coincidencias">${it.cands.map(id=>`<option value="${id}" ${it.accion==='importar'&&it.pid===id?'selected':''}>${h(nombreP(id))}</option>`).join('')}</optgroup>`:''}
        <optgroup label="Todo el personal">${DB.personal.slice().sort((x,y)=>x.nombre.localeCompare(y.nombre)).map(p=>`<option value="${p.id}" ${it.accion==='importar'&&it.pid===p.id&&!(it.cands||[]).includes(p.id)?'selected':''}>${h(p.nombre)} (Guardia ${p.guardia})</option>`).join('')}</optgroup></select>
        ${it.accion==='nueva'?`<br><select onchange="impSet(${idx},'guardia',this.value)" style="margin-top:4px">${optG(it.guardia)}</select>`:''}</td>
      <td><input type="number" style="width:70px" value="${it.disp??''}" onchange="impSet(${idx},'disp',this.value)"></td>
      <td class="num">${it.usados??'—'} / <b>${it.calc}</b></td>
      <td class="num">${it.rest??'—'}</td>
      <td><input style="width:250px" value="${h(it.franjas.map(f=>`${fmt(f.desde)} - ${fmt(f.hasta)}`).join('; '))}" onchange="impSet(${idx},'franjas',this.value)"></td>
      <td style="font-size:13px">${notas.map(h).join('<br>')}</td></tr>`;
  }).join('');
  estadoImp(`<div class="card"><h3 style="margin-top:0">Vista previa – ${h(archivo)} (período ${h(_imp.periodo)})</h3>
  <p><span class="tag v">✅ ${v} correctas</span> <span class="tag a">⚠️ ${a} para revisar</span> <span class="tag r">❌ ${r} no encontradas</span></p>
  <p class="muted">Podés corregir la persona, los días o las franjas (formato: dd/mm/aaaa - dd/mm/aaaa; separadas con punto y coma). Columna "Usados": lo que dice el archivo / lo que calcula el sistema.</p>
  <div class="tbl-wrap" style="max-height:65vh"><table class="tbl"><thead><tr><th>Estado</th><th>Leído del archivo</th><th>Persona en el sistema</th><th>Disp.</th><th class="num">Usados</th><th class="num">Rest.</th><th>Franjas</th><th>Observaciones</th></tr></thead><tbody>${filas}</tbody></table></div>
  <div class="acc"><button class="btn" onclick="estadoImp('')">Cancelar</button><button class="btn p" onclick="confirmarImport()">Confirmar importación</button></div></div>`);
}
function impSet(idx, k, v){
  const it = _imp.items[idx];
  if (k==='sel'){ if (v==='__nueva'){ it.accion='nueva'; it.pid=''; } else if (v==='__desc'){ it.accion='descartar'; } else { it.accion='importar'; it.pid=v; it.estado='ok'; } }
  else if (k==='disp') it.disp = v===''?null:+v;
  else if (k==='guardia') it.guardia = v;
  else if (k==='franjas') it.franjas = franjasDeTexto(v);
  dibujarPrevia();
}
async function confirmarImport(){
  const {items, archivo, periodo} = _imp;
  const reg = {id:uid(), fecha:new Date().toISOString(), archivo, periodo, cantidad:0, creadas:[], actualizadas:[], personas:[]};
  let desc = 0;
  // 1) altas nuevas
  items.forEach(it => { if (it.accion==='nueva'){ const ex = DB.personal.find(p=>claveNombre(p.nombre)===claveNombre(it.nombre)); if (ex) it.pid = ex.id; else { const p = nuevaPersona({nombre:it.nombre, guardia:it.guardia, dni:it.dni}); DB.personal.push(p); reg.personas.push(p.id); it.pid = p.id; } it.accion='importar'; } });
  // 2) agrupar filas de la misma persona (continuaciones)
  const grupos = {};
  items.forEach(it => { if (it.accion!=='importar' || !it.pid){ desc++; return; } const k = it.pid+'|'+it.periodo; if (!grupos[k]) grupos[k] = {pid:it.pid, periodo:it.periodo, disp:it.disp, franjas:[]}; grupos[k].franjas.push(...it.franjas); reg.cantidad++; });
  // 3) crear o actualizar
  Object.values(grupos).forEach(g => {
    const fr = g.franjas.filter(f=>f.desde&&f.hasta);
    const ex = DB.licencias.find(l=>l.personaId===g.pid && l.periodo===g.periodo);
    if (ex){ reg.actualizadas.push({id:ex.id, prev:JSON.parse(JSON.stringify(ex))}); ex.franjas = fr; if (g.disp!=null) ex.disponibles = g.disp; }
    else { const l = {id:uid(), personaId:g.pid, periodo:g.periodo, disponibles:g.disp??0, franjas:fr, obs:'Importado de '+archivo, importId:reg.id}; DB.licencias.push(l); reg.creadas.push(l.id); }
  });
  DB.importaciones.push(reg); UI.licPeriodo = periodo; save();
  const res = `${reg.creadas.length} importados, ${reg.actualizadas.length} actualizados, ${desc} descartados${reg.personas.length?`, ${reg.personas.length} personas nuevas`:''}.`;
  UI.licTab = 'listado'; render(); toast('Importación terminada: ' + res, 'ok');
}
async function deshacerImport(){
  const r = DB.importaciones.filter(i=>!i.deshecha).pop(); if (!r) return;
  if (!(await confirmar(`¿Deshacer la importación de "${r.archivo}" del ${new Date(r.fecha).toLocaleString('es-AR')}?`))) return;
  DB.licencias = DB.licencias.filter(l=>!r.creadas.includes(l.id));
  r.actualizadas.forEach(u=>{ const i = DB.licencias.findIndex(l=>l.id===u.id); if (i>=0) DB.licencias[i] = u.prev; });
  DB.personal = DB.personal.filter(p=>!r.personas.includes(p.id) || DB.licencias.some(l=>l.personaId===p.id));
  r.deshecha = true; save(); render(); toast('Importación deshecha','ok');
}

  </div>
  <div class="tbl-wrap"><table class="tbl" id="tblR"><thead><tr><th>Apellido y nombre</th><th>G</th>${cods.map(c=>`<th class="num" title="${h(c.nombre)}">${h(c.sigla)}</th>`).join('')}<th class="num">Horas extras</th><th class="num">Francos tomados</th><th class="num">Francos disp. hoy</th><th class="num">Días LA</th><th class="num">Días CM</th><th class="num">Capacit.</th></tr></thead>
  <tbody>${filas.map(f=>`<tr><td>${h(f.x.nombre)}</td><td>${f.x.guardia}</td>${cods.map(c=>`<td class="num">${f.as[c.sigla]||''}</td>`).join('')}<td class="num">${f.hm?minHM(f.hm):''}</td><td class="num">${f.fc||''}</td><td class="num">${f.s.disp}</td><td class="num">${f.la||''}</td><td class="num">${f.cm||''}</td><td class="num">${f.cpn?`${f.cpn} (${f.cph} h)`:''}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td><b>Totales</b></td><td></td>${cods.map(c=>`<td class="num"><b>${T(f=>f.as[c.sigla]||0)||''}</b></td>`).join('')}<td class="num"><b>${minHM(T('hm'))}</b></td><td class="num"><b>${T('fc')}</b></td><td></td><td class="num"><b>${T('la')}</b></td><td class="num"><b>${T('cm')}</b></td><td class="num"><b>${T('cpn')}</b></td></tr></tfoot></table></div>
  <p class="muted">Las columnas de códigos cuentan lo cargado en la planilla de asistencia dentro del período.</p>${printFoot()}`;
}
function repMes(d){ const t = hoy(); let y = +t.slice(0,4), m = +t.slice(5,7)-1+d; if (m<0){m=11;y--;} const ini = `${y}-${String(m+1).padStart(2,'0')}-01`; const fin = iso(new Date(Date.UTC(y,m+1,0))); filtroR.desde = ini; filtroR.hasta = d===0 ? t : fin; render(); }

/* =====================================================
   15. VISTA: NOVEDADES
   ===================================================== */
let filtroN = {g:'', q:''};
function vNovedades(){
  const q = norm(filtroN.q);
  const lista = DB.novedades.filter(n=>(!filtroN.g||n.guardia===filtroN.g)&&(!q||norm(n.texto+' '+nombreP(n.personaId)).includes(q))).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return `<h1>Libro de novedades</h1>
  <div class="card noprint"><div class="grid g4">
    <div class="f"><label>Fecha</label><input type="date" id="nf" value="${hoy()}"></div>
    <div class="f"><label>Guardia</label><select id="ng">${optG(guardiaDelDia(hoy())||'A','General')}</select></div>
    <div class="f"><label>Persona (opcional)</label><select id="np"><option value="">—</option>${optPersonas()}</select></div></div>
    <div class="f"><label>Novedad</label><textarea id="nt"></textarea></div><button class="btn p" onclick="guardarNovedad()">Guardar novedad</button></div>
  <div class="row noprint" style="margin-bottom:8px"><div><label>Buscar</label><input value="${h(filtroN.q)}" onchange="filtroN.q=this.value;render()"></div><div><label>Guardia</label><select onchange="filtroN.g=this.value;render()">${optG(filtroN.g,'Todas')}</select></div><button class="btn" onclick="imprimir()">Imprimir</button></div>
  ${printHead('Libro de novedades')}
  ${lista.map(n=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${fmt(n.fecha)} ${n.guardia?`– Guardia ${n.guardia}`:'– General'}${n.personaId?` – ${h(nombreP(n.personaId))}`:''}</b><button class="btn s noprint" onclick="borrarNovedad('${n.id}')">Eliminar</button></div><div style="white-space:pre-wrap;margin-top:6px">${h(n.texto)}</div></div>`).join('') || '<p class="muted">Sin novedades.</p>'}${printFoot()}`;
}
function guardarNovedad(){ const t = val('nt').trim(); if (!t) return alert('Escribí la novedad'); DB.novedades.push({id:uid(), fecha:val('nf'), guardia:val('ng'), personaId:val('np'), texto:t}); save(); render(); toast('Novedad guardada','ok'); }
async function borrarNovedad(id){ if (!(await confirmar('¿Eliminar esta novedad?'))) return; DB.novedades = DB.novedades.filter(n=>n.id!==id); save(); render(); }

/* =====================================================
   16. VISTA: CONFIGURACIÓN Y COPIAS DE SEGURIDAD
   ===================================================== */
function vConfig(){
  const c = DB.config;
  return `<h1>Configuración</h1>
  <div class="card"><h2 style="margin-top:0">Copias de seguridad</h2>
    <p>Los datos se guardan solo en este navegador y en esta computadora. Hacé una copia seguido y guardala en un pendrive o en Drive. ${c.ultimoBackup?`Última copia: <b>${new Date(c.ultimoBackup).toLocaleString('es-AR')}</b>.`:'<b>Todavía no se hizo ninguna copia.</b>'}</p>
    <div class="row"><button class="btn p" onclick="exportarBackup()">Exportar copia de seguridad</button>
    <button class="btn" onclick="$('#fbk').click()">Importar copia de seguridad</button><input type="file" id="fbk" accept=".json" style="display:none" onchange="importarBackup(this.files[0])">
    <button class="btn" onclick="borrarEjemplos()">Borrar datos de ejemplo</button>
    <button class="btn" style="color:#b91c1c;border-color:#b91c1c" onclick="borrarTodo()">Borrar todo</button></div></div>
  <div class="card"><h2 style="margin-top:0">Institución y rotación de guardias</h2><div class="grid g4">
    <div class="f" style="grid-column:1/-1"><label>Nombre de la institución (encabezados e impresiones)</label><input id="cfI" value="${h(c.institucion)}"></div>
    ${GUARDIAS.map(g=>`<div class="f"><label>Un día que trabajó la Guardia ${g}</label><input type="date" id="cfR${g}" value="${c.rotacion[g]||''}"></div>`).join('')}
    <div class="f"><label>Mínimo de presentes por guardia</label><input type="number" id="cfMin" value="${c.minPresentes}"></div>
    <div class="f"><label>Máximo de licencias a la vez por guardia</label><input type="number" id="cfMax" value="${c.maxLicencia}"></div></div>
    <p class="muted">Con una fecha por guardia alcanza: el sistema calcula el resto cada 3 días. Hoy (${fmt(hoy())}) le toca a la <b>Guardia ${guardiaDelDia(hoy())||'?'}</b>.</p>
    <button class="btn p" onclick="guardarConfig()">Guardar</button></div>
  <div class="card"><h2 style="margin-top:0">Códigos de asistencia</h2>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sigla</th><th>Nombre</th><th>Fondo</th><th>Texto</th><th>Tecla</th><th>Vista</th><th></th></tr></thead><tbody>
    ${c.codigos.map((x,i)=>`<tr><td><input style="width:90px" value="${h(x.sigla)}" onchange="codSet(${i},'sigla',this.value)" ${['P','FC','CM','LA','CG'].includes(x.sigla)?'readonly title="Código del sistema"':''}></td><td><input value="${h(x.nombre)}" onchange="codSet(${i},'nombre',this.value)"></td>
      <td><input type="color" value="${x.color}" onchange="codSet(${i},'color',this.value)"></td><td><input type="color" value="${x.texto}" onchange="codSet(${i},'texto',this.value)"></td>
      <td><input style="width:50px" maxlength="1" value="${h(x.tecla||'')}" onchange="codSet(${i},'tecla',this.value)"></td><td><b style="background:${x.color};color:${x.texto};padding:3px 9px;border-radius:5px">${h(x.sigla)}</b></td>
      <td>${['P','FC','CM','LA','CG'].includes(x.sigla)?'':`<button class="btn s" onclick="codDel(${i})">Quitar</button>`}</td></tr>`).join('')}</tbody></table></div>
    <button class="btn" style="margin-top:8px" onclick="codAdd()">+ Agregar código</button>
    <p class="muted">P, FC, CM, LA y CG están conectados con otros módulos y no se pueden quitar.</p></div>
  <div class="card"><h2 style="margin-top:0">Feriados (para contar días hábiles de licencia)</h2>
    <p class="muted">Uno por renglón, formato dd/mm/aaaa. Ya están cargados los mismos días que usa el cronograma de licencias 26-27 (incluye 24 y 31 de diciembre como no laborables). Revisá los feriados trasladables de cada año.</p>
    <textarea id="cfF" style="min-height:220px;font-family:monospace">${c.feriados.slice().sort().map(fmt).join('\n')}</textarea>
    <button class="btn p" onclick="guardarFeriados()">Guardar feriados</button></div>`;
}
function guardarConfig(){ const c = DB.config; c.institucion = val('cfI').trim()||c.institucion; GUARDIAS.forEach(g=>c.rotacion[g]=val('cfR'+g)); c.minPresentes = +val('cfMin')||0; c.maxLicencia = +val('cfMax')||0; save(); render(); toast('Configuración guardada','ok'); }
function codSet(i,k,v){ DB.config.codigos[i][k] = k==='sigla'?v.trim().toUpperCase():k==='tecla'?v.toLowerCase():v; save(); render(); }
function codAdd(){ DB.config.codigos.splice(DB.config.codigos.length-1, 0, {sigla:'NUEVO', nombre:'Nuevo código', color:'#e5e7eb', texto:'#111827', tecla:''}); save(); render(); }
function codDel(i){ DB.config.codigos.splice(i,1); save(); render(); }
function guardarFeriados(){ const fs = val('cfF').split(/\n/).map(x=>parseFecha(x.trim())).filter(Boolean); DB.config.feriados = [...new Set(fs)].sort(); save(); render(); toast(`${fs.length} feriados guardados`,'ok'); }
function exportarBackup(){
  DB.config.ultimoBackup = new Date().toISOString(); save();
  descargar(`respaldo_ETAC_personal_${hoy()}.json`, JSON.stringify(DB, null, 1), 'application/json');
  render(); toast('Copia descargada. Guardala en un lugar seguro.','ok');
}
async function importarBackup(f){
  if (!f) return;
  try{
    const d = JSON.parse(await f.text()); if (!d.personal || !d.config) throw new Error('El archivo no es una copia de seguridad de este sistema.');
    if (!(await confirmar(`La copia tiene ${d.personal.length} personas. Se van a REEMPLAZAR todos los datos actuales. ¿Continuar?`))) return;
    DB = migrar(d); save(); render(); toast('Copia de seguridad restaurada','ok');
  }catch(e){ toast(e.message,'e'); }
}
async function borrarEjemplos(){
  if (!(await confirmar('¿Borrar los registros de ejemplo (horas extras, capacitación, carpeta y novedad de muestra)? El personal no se borra.'))) return;
  ['horas','francos','licencias','capacitaciones','carpetas','novedades'].forEach(k=>DB[k] = DB[k].filter(x=>!x.ejemplo));
  save(); render(); toast('Datos de ejemplo borrados','ok');
}
async function borrarTodo(){
  const t = await confirmar('Esto borra TODOS los datos (personal incluido). Escribí BORRAR para confirmar.', true, 'Confirmación');
  if (t !== 'BORRAR') return toast('No se borró nada');
  const cfg = DB.config; DB = datosIniciales(); ['personal','horas','capacitaciones','carpetas','novedades'].forEach(k=>DB[k]=[]); DB.config = cfg; save(); render();
}
function migrar(d){ const b = datosIniciales(); for (const k of Object.keys(b)) if (d[k]==null) d[k] = b[k]; d.config = {...b.config, ...d.config}; return d; }

/* =====================================================
   17. VISTA: ACERCA DE
   ===================================================== */
function vAcerca(){
  return `<div class="card acerca"><img src="logo-etac.jpg" alt="ETAC" onerror="logoFallback(this,'ETAC')"><img src="logo-jmm.png" alt="JMM" onerror="logoFallback(this,'JMM')">
  <h1>Sistema de Gestión de Personal</h1><p>${h(DB.config.institucion)}</p><p><b>Versión 1.0</b> – Noviembre 2026</p>
  <p>Autor: <b>Maldonado Jorge Matias – JMM Gestiones y Tecnologías</b></p>
  <p><a class="btn p" href="https://wa.me/543541633175" target="_blank" rel="noopener">WhatsApp 3541 633175</a> <a class="btn" href="mailto:jorgematiasmaldonado@gmail.com">jorgematiasmaldonado@gmail.com</a></p>
  <p class="muted">Los datos se guardan únicamente en este navegador. Hacé copias de seguridad desde Configuración.</p></div>`;
}

/* =====================================================
   18. ARRANQUE
   ===================================================== */
(async function init(){
  await Store.open();
  const d = await Store.get('data');
  DB = d ? migrar(d) : datosIniciales();
  if (!d) save();
  menu(); render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
</body>
</html>
