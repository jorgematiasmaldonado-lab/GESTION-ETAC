<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de Personal – ETAC</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('etac_tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}</script>
<style>
/* ===================== ESTILOS =====================
   Hojas de estilo propias (sin CDN) para que la app se vea
   bien aunque no haya internet. Tema claro y oscuro con variables. */
:root{
  --rojo:#E3191B; --rojo-osc:#b51214; --negro:#0d0d0d; --navy:#0B1426; --celeste:#22D3EE;
  --bg:#f3f4f6; --card:#ffffff; --card2:#f9fafb; --borde:#d1d5db; --borde2:#e5e7eb; --texto:#111827; --sub:#4b5563;
  --input:#ffffff; --input-b:#9ca3af; --hover:#f3f4f6; --link:#1d4ed8; --th:#111111; --th-tx:#ffffff; --nc:#f3f4f6;
  --verde:#15803d; --verde-bg:#dcfce7; --amar:#a16207; --amar-bg:#fef9c3; --amar-b:#facc15; --rojo-bg:#fee2e2; --rojo-tx:#991b1b; --rojo-b:#fca5a5;
  --banner:#fef3c7; --sombra:0 6px 24px rgba(0,0,0,.12); --gd-bg:#bfe9f5; --gd-tx:#075985;
  color-scheme:light;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e131b; --card:#161c26; --card2:#1c2330; --borde:#2e3a4b; --borde2:#253041; --texto:#e8edf4; --sub:#9fadbf;
  --input:#0e131b; --input-b:#3d4b60; --hover:#212a37; --link:#7cb3ff; --th:#05070a; --th-tx:#e8edf4; --nc:#212a37;
  --verde:#4ade80; --verde-bg:#11301e; --amar:#facc15; --amar-bg:#352c0c; --amar-b:#7c6513; --rojo-bg:#3a1416; --rojo-tx:#fca5a5; --rojo-b:#7f1d1d;
  --banner:#352a0a; --sombra:0 6px 24px rgba(0,0,0,.5); --gd-bg:#155e75; --gd-tx:#e0f7ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;color:var(--texto);background:var(--bg);padding-bottom:64px;transition:background .2s,color .2s}
a{color:inherit}
header.top{background:var(--negro);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;position:sticky;top:0;z-index:30;min-height:62px}
header.top img{height:44px;width:auto;max-width:200px;object-fit:contain}
header.top .tit{font-weight:700;font-size:19px;line-height:1.1}
header.top .tit small{display:block;font-weight:400;font-size:13px;color:#d1d5db}
.tema{margin-left:auto;background:#262626;border:1px solid #444;color:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.tema:hover{background:#333}
.logo-txt{font-weight:900;letter-spacing:2px;font-size:24px;color:#fff;border:2px solid var(--rojo);padding:2px 8px;border-radius:6px}
nav.menu{background:#1f1f1f;display:flex;overflow-x:auto;position:sticky;top:62px;z-index:29}
nav.menu button{background:none;border:0;color:#e5e7eb;padding:12px 14px;font-size:15px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
nav.menu button.act{color:#fff;border-bottom-color:var(--rojo);font-weight:700}
nav.menu button:hover{background:#2d2d2d}
main{max-width:1400px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0 14px}
h2{font-size:20px;margin:18px 0 10px}
h3{font-size:17px;margin:12px 0 8px}
.card{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat{background:var(--card);border:1px solid var(--borde);border-left:6px solid var(--sub);border-radius:10px;padding:12px}
.stat .n{font-size:30px;font-weight:800}
.stat .l{color:var(--sub);font-size:14px}
.stat.r{border-left-color:var(--rojo)} .stat.v{border-left-color:#16a34a} .stat.a{border-left-color:#ca8a04} .stat.c{border-left-color:#0891b2}
.stat ul{margin:6px 0 0;padding-left:18px;font-size:14px;max-height:160px;overflow:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:0 0 auto}
label{display:block;font-size:14px;color:var(--sub);margin-bottom:3px;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--input-b);border-radius:7px;background:var(--input);color:var(--texto);max-width:100%}
textarea{width:100%;min-height:80px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #fca5a5;outline-offset:1px}
.f{margin-bottom:10px}
.f input,.f select,.f textarea{width:100%}
.btn{font:inherit;font-size:15px;padding:9px 14px;border-radius:7px;border:1px solid var(--input-b);background:var(--card);color:var(--texto);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.p:hover{background:var(--rojo-osc)}
.btn.d{background:var(--texto);border-color:var(--texto);color:var(--bg)}
.btn.s{padding:5px 9px;font-size:13px}
.btn.lnk{border:0;background:none;color:var(--link);text-decoration:underline;padding:2px 4px;text-align:left;white-space:normal}
.tbl-wrap{overflow:auto;background:var(--card);border:1px solid var(--borde);border-radius:10px}
table.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--borde2);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--th);color:var(--th-tx);position:sticky;top:0;font-size:14px;z-index:1}
.tbl tr:hover td{background:var(--hover)}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tr.anul td{color:var(--sub);text-decoration:line-through}
.tbl tfoot td{background:var(--card2);font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:13px;font-weight:700;background:var(--borde2);color:var(--texto)}
.tag.v{background:var(--verde-bg);color:var(--verde)} .tag.a{background:var(--amar-bg);color:var(--amar)} .tag.r{background:var(--rojo-bg);color:var(--rojo-tx)} .tag.n{background:var(--texto);color:var(--bg)}
.bar{height:14px;background:var(--borde2);border-radius:999px;overflow:hidden;min-width:120px}
.bar>div{height:100%;background:var(--rojo)}
.bar.ok>div{background:#16a34a}
.muted{color:var(--sub);font-size:14px}
.warn{background:var(--amar-bg);border:1px solid var(--amar-b);color:var(--texto);padding:10px 12px;border-radius:8px;margin-bottom:12px}
.err{background:var(--rojo-bg);border:1px solid var(--rojo-b);color:var(--texto);padding:10px 12px;border-radius:8px;margin-bottom:12px}
.okbox{background:var(--verde-bg);border:1px solid #16a34a;color:var(--texto);padding:10px 12px;border-radius:8px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--input-b);background:var(--card);color:var(--texto);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.tabs button.act{background:var(--texto);color:var(--bg);border-color:var(--texto)}
.lst-item{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--borde2);padding:4px 0;align-items:center}
/* Barra de filtros (guardia + búsqueda) */
.fbar{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;position:sticky;top:106px;z-index:20;box-shadow:var(--sombra)}
.fbar .fq{flex:1 1 220px}
.fbar .fq input{width:100%}
.fbar .fbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.fbar .chip{font-size:13px;color:var(--sub);align-self:center}
/* Listas contraíbles */
.grp{background:var(--card);border:1px solid var(--borde);border-radius:10px;margin-bottom:12px;overflow:hidden}
.grp-h{width:100%;display:flex;align-items:center;gap:10px;background:var(--card2);border:0;border-bottom:1px solid var(--borde);color:var(--texto);font:inherit;font-size:17px;font-weight:800;padding:10px 14px;cursor:pointer;text-align:left}
.grp-h:hover{background:var(--hover)}
.grp-h .car{width:18px;color:var(--rojo)}
.grp-h .grp-n{background:var(--texto);color:var(--bg);border-radius:999px;font-size:13px;padding:1px 9px}
.grp-h .grp-a{margin-left:auto;font-size:13px;font-weight:600;color:var(--sub)}
.grp-b{padding:0}
.grp-b>.pad{padding:10px 14px}
.grp .tbl-wrap{border:0;border-radius:0}
.gdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:2px}
/* Planilla de asistencia */
table.plan{border-collapse:collapse;background:var(--card);font-size:15px}
.plan th,.plan td{border:1px solid var(--borde);padding:0;text-align:center}
.plan th{background:var(--th);color:var(--th-tx);padding:6px 6px;font-size:13px;position:sticky;top:0;z-index:2}
.plan td.nom{text-align:left;padding:4px 8px;white-space:nowrap;font-weight:600;position:sticky;left:0;background:var(--card);z-index:1}
.plan td.nro{padding:4px 6px;color:var(--sub);font-size:13px}
.plan td.tot{padding:4px 6px;font-size:12px;white-space:nowrap;text-align:left;color:var(--sub)}
.plan tfoot td{padding:5px;font-weight:700;background:var(--card2)}
.plan tfoot td.bajo{background:var(--rojo-bg);color:var(--rojo-tx)}
.cel{width:62px;height:40px;border:0;background:transparent;color:var(--texto);font:inherit;font-weight:800;font-size:15px;cursor:pointer;position:relative}
.cel:focus{outline:3px solid #2563eb;outline-offset:-3px}
.cel.auto{font-style:italic;opacity:.85}
.cel.sug{opacity:.5;font-style:italic}
.cel.nc{color:var(--sub);cursor:not-allowed;background:var(--nc)}
.cel .dot{position:absolute;top:2px;right:3px;width:7px;height:7px;border-radius:50%;background:#2563eb}
.leyenda span{display:inline-block;margin:0 10px 6px 0;font-size:14px}
.leyenda b{display:inline-block;padding:2px 7px;border-radius:5px;margin-right:4px}
/* Calendario licencias */
table.cal{border-collapse:collapse;font-size:12px;background:var(--card)}
.cal th,.cal td{border:1px solid var(--borde2);width:24px;height:24px;text-align:center;padding:0}
.cal th{background:var(--th);color:var(--th-tx)}
.cal td.nom{width:auto;text-align:left;padding:2px 6px;white-space:nowrap;font-size:13px;font-weight:600}
.cal td.lic{background:var(--rojo);color:#fff}
.cal td.fs{background:var(--nc)}
.cal td.gd{background:var(--gd-bg);color:var(--gd-tx);font-weight:800;font-size:10px}
.cal th.gd{background:#0891b2;color:#fff}
.cal td.lic.gd{background:var(--rojo);color:#fff;box-shadow:inset 0 -5px 0 #22d3ee}
@media print{.cal td.gd,.cal th.gd{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.cal tfoot td.exc{background:#fde047;color:#111;font-weight:800}
/* Modal y avisos */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:30px 10px;overflow:auto}
.modal{background:var(--card);color:var(--texto);border-radius:12px;width:100%;max-width:720px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal.xl{max-width:1250px}
.modal h2{margin-top:0}
.modal .acc{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toasts{position:fixed;right:14px;bottom:80px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:#111;color:#fff;padding:12px 14px;border-radius:9px;box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:15px;border:1px solid #333}
.toast.e{background:var(--rojo-osc)} .toast.ok{background:#15803d}
.toast .btn{margin-top:8px;background:#fff;color:#111}
.banner{background:var(--banner);border-bottom:2px solid #f59e0b;padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:15px}
/* Pie JMM */
footer.jmm{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#cbd5e1;display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 12px;font-size:13px;z-index:40;flex-wrap:wrap;text-align:center;border-top:1px solid #1e2a44}
footer.jmm img{height:24px;width:auto}
footer.jmm a{color:var(--celeste);text-decoration:none;font-weight:600}
.codes button{min-width:74px;margin:3px;color:#111}
.dz{border:3px dashed var(--input-b);border-radius:12px;padding:30px;text-align:center;background:var(--card);cursor:pointer}
.dz.on{border-color:var(--rojo);background:var(--rojo-bg)}
.acerca{text-align:center}
.acerca img{max-width:280px;max-height:150px;margin:10px;border-radius:10px}
.prev-ok td{background:var(--verde-bg)!important} .prev-a td{background:var(--amar-bg)!important} .prev-r td{background:var(--rojo-bg)!important} .prev-d td{opacity:.55}
/* ===== Hoja de informe (siempre fondo blanco, como el papel) ===== */
.prev-wrap{background:#525659;border-radius:10px;padding:24px 10px;overflow:auto}
[data-theme="dark"] .prev-wrap{background:#05070a}
.hoja{background:#fff;color:#111;width:100%;max-width:820px;margin:0 auto;padding:40px 46px;box-shadow:0 4px 30px rgba(0,0,0,.45);font-size:13px;line-height:1.45;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.hoja *{color-scheme:light}
.h-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid #111;padding-bottom:12px;margin-bottom:16px}
.h-head img{height:54px;width:auto;background:#000;border-radius:6px;padding:4px}
.h-inst{font-size:12px;color:#52514e;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.h-tit{font-size:22px;font-weight:800;color:#0b0b0b;line-height:1.15}
.h-sub{font-size:12.5px;color:#52514e}
.h-fecha{margin-left:auto;text-align:right;font-size:11.5px;color:#52514e;white-space:nowrap}
.h-sec{margin:18px 0}
.h-sec h4{break-after:avoid;page-break-after:avoid}
.h-res,.h-kpis,.h-dos>.h-graf{break-inside:avoid;page-break-inside:avoid}
.h-sec h4{font-size:15px;margin:0 0 8px;color:#0b0b0b;border-left:4px solid #E3191B;padding-left:8px}
.h-res{background:#f6f6f4;border:1px solid #e3e2de;border-radius:8px;padding:10px 14px}
.h-res ul{margin:0;padding-left:18px}
.h-res li{margin:3px 0}
.h-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.h-kpi{border:1px solid #e3e2de;border-radius:8px;padding:8px 10px}
.h-kpi .v{font-size:21px;font-weight:800;color:#0b0b0b;line-height:1.1}
.h-kpi .e{font-size:11.5px;color:#52514e}
.h-dos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.h-graf{border:1px solid #e3e2de;border-radius:8px;padding:8px 10px;break-inside:avoid}
.h-graf .gt{font-size:12.5px;font-weight:700;color:#0b0b0b;margin-bottom:2px}
.h-graf .gs{font-size:11px;color:#52514e;margin-bottom:4px}
.h-graf svg{width:100%;height:auto;display:block}
.h-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:#52514e;margin:2px 0 4px}
.h-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table.ht{border-collapse:collapse;width:100%;font-size:11.5px}
.ht th{background:#f0efec;color:#0b0b0b;text-align:left;padding:5px 6px;border-bottom:2px solid #c3c2b7;font-weight:700}
.ht td{padding:4px 6px;border-bottom:1px solid #e3e2de;color:#1f1f1f;vertical-align:top}
.ht td.n,.ht th.n{text-align:right;font-variant-numeric:tabular-nums}
.ht tr.tot td{font-weight:800;border-top:2px solid #c3c2b7;background:#fafaf8}
.ht tr{break-inside:avoid}
.h-vacio{color:#52514e;font-style:italic;padding:6px 0}
.h-firmas{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:56px;break-inside:avoid}
.h-firmas div{border-top:1px solid #111;padding-top:6px;text-align:center;font-size:12px;color:#333}
.h-pie{margin-top:26px;border-top:1px solid #c3c2b7;padding-top:6px;font-size:10.5px;color:#52514e;text-align:center}
.h-def{font-size:11px;color:#52514e;margin-top:4px}
@media (max-width:700px){
  body{font-size:16px}
  header.top .tit small{display:none}
  main{padding:10px}
  footer.jmm{font-size:11px;gap:6px}
  footer.jmm .opt{display:none}
  .fbar{position:static;box-shadow:none}
  .tema{padding:6px 10px;font-size:16px}
  .tema .tt{display:none}
  header.top{gap:10px;padding:8px 10px}
  header.top img{height:36px;max-width:130px}
  header.top .tit{font-size:16px}
  .hoja{padding:22px 16px}
  .h-kpis{grid-template-columns:repeat(2,1fr)}
  .h-dos{grid-template-columns:1fr}
}
.print-only,.ph,.pf{display:none}
/* Impresión */
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;color:#111!important;padding:0;font-size:12px}
  :root,[data-theme="dark"]{--bg:#fff;--card:#fff;--card2:#f5f5f5;--texto:#111;--sub:#444;--borde:#bbb;--borde2:#ddd;--hover:#fff;--th:#ddd;--th-tx:#000;--nc:#eee}
  header.top,nav.menu,footer.jmm,.noprint,#toasts,.banner,.btn,.tabs,.fbar,.grp-h .grp-a{display:none!important}
  .grp-b{display:block!important}
  .grp{border:0;margin-bottom:8px}
  .grp-h{background:none;border-bottom:1px solid #999;padding:4px 0}
  main{max-width:none;padding:0}
  .card,.tbl-wrap{border:0;padding:0;box-shadow:none}
  .tbl th,.plan th,.cal th{background:#ddd!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl th,.tbl td{padding:3px 5px;font-size:11px}
  .cel{width:40px;height:22px;font-size:11px}
  .plan td.nom{position:static}
  .cal td.lic,.cel{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ph{display:flex!important;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .ph img{height:44px;background:#000;padding:3px}
  .pf{display:block!important;margin-top:16px;border-top:1px solid #999;padding-top:4px;font-size:10px;color:#444;text-align:center}
  .modal-bg{position:static;background:none;padding:0}
  .modal{box-shadow:none;max-width:none;padding:0}
  body.modal-print main{display:none}
  body.modal-print .modal .acc{display:none}
  /* Informe en PDF: solo la hoja */
  body.pi main>*:not(.prev-wrap){display:none!important}
  body.pi #modalRoot{display:none!important}
  body.pi .prev-wrap{background:none;padding:0}
  body.pi .hoja{box-shadow:none;max-width:none;width:auto;padding:0;margin:0}
  .hoja *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

const D = s => new Date(s + 'T00:00:00Z');

  if (t == null || t === '') return null;
  if (typeof t === 'number' && t > 20000 && t < 80000) return iso(new Date(Date.UTC(1899,11,30) + t*MS));
  t = String(t).trim();
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return valid(+m[1], +m[2], +m[3]);
  m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m){ let y=+m[3]; if (y<100) y+=2000; return valid(y, +m[2], +m[1]); }

}

  return `<div class="grp" data-k="${h(key)}"><button class="grp-h" onclick="toggleGrp(this)" aria-expanded="${ab}"><span class="car">${ab?'▾':'▸'}</span><span>${titulo}</span>${n!=null?`<span class="grp-n">${n}</span>`:''}<span class="grp-a">${ab?'Contraer':'Expandir'}</span></button><div class="grp-b" ${ab?'':'hidden'}>${html}</div></div>`;
}
function setGrp(el, ab){ UI.grp[el.dataset.k] = ab; el.querySelector('.grp-b').hidden = !ab; el.querySelector('.car').textContent = ab?'▾':'▸'; el.querySelector('.grp-a').textContent = ab?'Contraer':'Expandir'; el.querySelector('.grp-h').setAttribute('aria-expanded', ab); }
function toggleGrp(btn){ const el = btn.closest('.grp'); setGrp(el, el.querySelector('.grp-b').hidden); guardarGrp(); }
function grpTodos(ab){ $$('.grp').forEach(el => setGrp(el, ab)); guardarGrp(); }
function guardarGrp(){ try{ localStorage.setItem('etac_grp', JSON.stringify(UI.grp)); }catch(e){} }
const COL_G = { A:'#2a78d6', B:'#eb6834', C:'#1baf7a' };
const dotG = g => `<span class="gdot" style="background:${COL_G[g]}"></span>`;
const tituloG = g => `${dotG(g)} Guardia ${g}`;

const optPersonasF = (sel='') => { const l = activos().filter(pasa); return (l.length?l:activos()).map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${h(p.nombre)} (Guardia ${p.guardia})</option>`).join(''); };


/* ---------- Exportar CSV (se abre en Excel) ---------- */
function descargar(nombre, contenido, tipo){ const b = new Blob([contenido], {type:tipo}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); }
function exportCSV(nombre, filas){ const esc = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }; descargar(nombre, '﻿' + filas.map(r=>r.map(esc).join(';')).join('\r\n'), 'text/csv;charset=utf-8'); }
function tablaACSV(sel, nombre){ const t = document.querySelector(sel); if (!t) return; exportCSV(nombre, Array.from(t.querySelectorAll('tr')).map(tr=>Array.from(tr.children).filter(c=>!c.classList.contains('noprint')).map(c=>c.innerText.trim()))); }

function vInicio(){
  const t = hoy(), m = addD(t,1);
  const gH = guardiaDelDia(t), gM = guardiaDelDia(m);
  const ps = activos().filter(pasa);
  const ids = new Set(ps.map(p=>p.id));
  const enCM = ps.filter(p => carpetaEn(p.id,t));
  const enLA = ps.filter(p => licenciaEn(p.id,t));
  const prox = [];
  DB.licencias.forEach(l => { if (!ids.has(l.personaId)) return; l.franjas.forEach(f => { if (f.desde > t && f.desde <= addD(t,15)) prox.push({p:l.personaId, f:f.desde, h:f.hasta}); }); });
  prox.sort((a,b)=>a.f.localeCompare(b.f));
  const sal = ps.map(p => ({p, s:saldo(p.id)}));
  const conF = sal.filter(x=>x.s.disp>0), cerca = sal.filter(x=>x.s.disp<=0 && x.s.avance>=1200);
  const cg = DB.cambios.filter(c=>!c.devuelto && (ids.has(c.personaId)||ids.has(c.conId)));
  const caps = DB.capacitaciones.filter(c=>c.fecha>=t).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,5);
  const certP = DB.carpetas.filter(c=>!c.presento && ids.has(c.personaId));
  const li = (arr, f) => arr.length ? `<ul>${arr.map(f).join('')}</ul>` : '<div class="muted">Nadie</div>';
  const bloqueG = (g, f, tit) => {
    if (!g) return `<div class="card"><h3>${tit}</h3><div class="muted">Configurá la rotación de guardias.</div></div>`;
    const mi = activos().filter(p=>guardiaEn(p,f)===g);
    const fuera = mi.map(p=>({p, c:celda(p.id,f)})).filter(x=>x.c.cod && !['P','PASIVA','—'].includes(x.c.cod));
    return `<div class="card"><h3>${tit}: <span class="tag n">Guardia ${g}</span> <span class="muted">${fmt(f)}</span></h3>
      <div><b>${mi.length}</b> integrantes · <b>${mi.length - fuera.filter(x=>!x.c.sug).length}</b> disponibles</div>
      ${fuera.length?`<div style="margin-top:6px">${fuera.map(x=>`<span class="tag ${x.c.cod==='CM'?'r':'a'}" style="margin:2px">${h(x.p.nombre)}: ${x.c.cod}${x.c.sug?'?':''}</span>`).join('')}</div>`:'<div class="muted">Sin ausencias cargadas.</div>'}
      <button class="btn s" style="margin-top:8px" onclick="abrirAsistencia('${g}','${f}')">Ver planilla</button></div>`;
  };
  return `<h1>Panel de inicio <span class="muted">${fmt(t)}</span></h1>
  ${barra('general')}
  <div class="grid g2">${bloqueG(gH,t,'Guardia de hoy')}${bloqueG(gM,m,'Guardia de mañana')}</div>
  <div class="grid g3">
    <div class="stat r"><div class="n">${enCM.length}</div><div class="l">De carpeta médica hoy</div>${li(enCM,p=>`<li>${h(p.nombre)} (Guardia ${p.guardia}) – vuelve ${fmt(addD(finCarpeta(carpetaEn(p.id,t)),1))}</li>`)}</div>
    <div class="stat"><div class="n">${enLA.length}</div><div class="l">De licencia anual hoy</div>${li(enLA,p=>`<li>${h(p.nombre)} (Guardia ${p.guardia})</li>`)}</div>
    <div class="stat c"><div class="n">${prox.length}</div><div class="l">Salen de licencia en los próximos 15 días</div>${li(prox,x=>`<li>${fmt(x.f)}: ${h(nombreP(x.p))} (hasta ${fmt(x.h)})</li>`)}</div>
    <div class="stat v"><div class="n">${conF.length}</div><div class="l">Con franco disponible</div>${li(conF,x=>`<li>${h(x.p.nombre)}: <b>${x.s.disp}</b></li>`)}</div>
    <div class="stat a"><div class="n">${cerca.length}</div><div class="l">Cerca del franco (más de 20 h)</div>${li(cerca,x=>`<li>${h(x.p.nombre)}: faltan ${minHM(x.s.resto)}</li>`)}</div>
    <div class="stat a"><div class="n">${cg.length}</div><div class="l">Cambios de guardia sin devolver</div>${li(cg,c=>`<li>${h(nombreP(c.personaId))} ↔ ${h(nombreP(c.conId))}${c.devolucion?' – devuelve '+fmt(c.devolucion):''}</li>`)}</div>
    <div class="stat c"><div class="n">${caps.length}</div><div class="l">Próximas capacitaciones</div>${li(caps,c=>`<li>${fmt(c.fecha)}: ${h(c.tema)}</li>`)}</div>
    <div class="stat r"><div class="n">${certP.length}</div><div class="l">Certificados médicos pendientes</div>${li(certP,c=>`<li>${h(nombreP(c.personaId))} (desde ${fmt(c.inicio)})</li>`)}</div>
    ${(()=>{ const lp = lmPendientes(ids); return `<div class="stat r"><div class="n">${lp.length}</div><div class="l">Licencias médicas sin homologar (más de ${umbralLM()} días)</div>${li(lp,({p,e})=>`<li>${h(p.nombre)}: ${e.dias} días – ${e.homo}</li>`)}</div>`; })()}
  </div>
  <h2>Vista por guardia</h2>
  <div class="grid g3" style="align-items:start">${gsVisibles().map(g=>{ const mi = ps.filter(p=>guardiaEn(p,t)===g); return grupo('ini-'+g, tituloG(g), mi.length,
    `<div class="pad" style="max-height:340px;overflow:auto">${mi.map(p=>{ const s=saldo(p.id); const c = carpetaEn(p.id,t)?'<span class="tag r">CM</span>':licenciaEn(p.id,t)?'<span class="tag">LA</span>':''; return `<div class="lst-item"><button class="btn lnk" onclick="ficha('${p.id}')">${h(p.nombre)}</button><span>${c} ${s.disp>0?`<span class="tag v">${s.disp} FC</span>`:''}</span></div>`; }).join('') || '<div class="muted">Nadie coincide con la búsqueda.</div>'}</div>`); }).join('')}</div>`;

function guardarPersona(id){
  const nombre = mayus(val('pn')); if (!nombre) return alert('Falta el apellido y nombre');
  let p = id ? persona(id) : null;
  if (!p){ p = nuevaPersona({nombre, guardia:val('pg')}); DB.personal.push(p); }
  const g = val('pg');
  if (id && g !== p.guardia){ p.historialGuardia = p.historialGuardia || [{guardia:p.guardia, desde:'2000-01-01'}]; p.historialGuardia.push({guardia:g, desde: val('pgd')||hoy()}); }
  Object.assign(p, { nombre, dni:val('pd').trim(), guardia:g, cargo:val('pc').trim(), tel:val('pt').trim(), ingreso:val('pi'), activo: val('pa')==='1', obs:val('po'), saldoInicialMin: (+val('psh')||0)*60 + (+val('psm')||0) });
  save(); cerrarModal(); render(); toast('Datos guardados','ok');
}
async function borrarPersona(id){
  const n = DB.horas.filter(x=>x.personaId===id).length + DB.francos.filter(x=>x.personaId===id).length + DB.licencias.filter(x=>x.personaId===id).length + DB.carpetas.filter(x=>x.personaId===id).length;
  if (n && !(await confirmar(`Esta persona tiene ${n} registros. Si la eliminás se borran también. Para conservar el historial conviene marcarla como "Inactivo". ¿Eliminar igual?`))) return;
  if (!n && !(await confirmar('¿Eliminar esta persona?'))) return;
  DB.personal = DB.personal.filter(p=>p.id!==id);
  ['horas','francos','licencias','carpetas','cambios','novedades'].forEach(k => DB[k] = DB[k].filter(x=>x.personaId!==id));
  Object.keys(DB.asistencia).forEach(k=>{ if (k.startsWith(id+'|')) delete DB.asistencia[k]; });
  DB.capacitaciones.forEach(c=>delete c.asistentes[id]);
  save(); cerrarModal(); render();
}
function importarPersonal(){
  modal(`<h2>Importar personal</h2><p>Elegí un Excel o CSV con una columna <b>Apellido y nombre</b> y una columna <b>Guardia</b> (A, B o C). Opcionales: DNI, Cargo, Teléfono. Las personas que ya existen no se duplican.</p>
  <input type="file" id="fper" accept=".csv,.xlsx,.xls"><div id="perRes" style="margin-top:10px"></div>
  <div class="acc"><button class="btn" onclick="cerrarModal()">Cerrar</button><button class="btn p" onclick="procesarPersonal()">Importar</button></div>`);
}
async function procesarPersonal(){
  const f = $('#fper').files[0]; if (!f) return alert('Elegí un archivo');
  try{
    const filas = await leerTabla(f);
    const hi = filas.findIndex(r => r.some(c => /nombre|apellido|agente/.test(norm(c))));
    if (hi < 0) return $('#perRes').innerHTML = '<div class="err">No encontré la columna de apellido y nombre.</div>';
    const hd = filas[hi].map(norm), col = re => hd.findIndex(x=>re.test(x));
    const cN = col(/nombre|apellido|agente/), cG = col(/guardia/), cD = col(/dni|legajo/), cC = col(/cargo|jerarq/), cT = col(/tel/);
    let nuevos = 0, exist = 0;
    for (const r of filas.slice(hi+1)){
      const n = mayus(r[cN]); if (!n) continue;
      if (DB.personal.some(p => claveNombre(p.nombre)===claveNombre(n))){ exist++; continue; }
      const g = String(r[cG]||'').toUpperCase().replace(/GUARDIA|\s|"/g,'');
      DB.personal.push(nuevaPersona({nombre:n, guardia: GUARDIAS.includes(g)?g:'A', dni: cD>=0?String(r[cD]||''):'', cargo: cC>=0?String(r[cC]||''):'', tel: cT>=0?String(r[cT]||''):''}));
      nuevos++;
    }
    save(); render(); $('#perRes').innerHTML = `<div class="okbox">${nuevos} personas agregadas · ${exist} ya existían.</div>`;
  }catch(e){ $('#perRes').innerHTML = `<div class="err">${h(e.message)}</div>`; }
}

/* ---------- Ficha individual ---------- */
function ficha(id){
  const p = persona(id); const s = saldo(id); const t = hoy();
  const hs = DB.horas.filter(x=>x.personaId===id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const fr = DB.francos.filter(x=>x.personaId===id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const li = DB.licencias.filter(x=>x.personaId===id).sort((a,b)=>b.periodo.localeCompare(a.periodo));
  const ca = DB.carpetas.filter(x=>x.personaId===id).sort((a,b)=>b.inicio.localeCompare(a.inicio));
  const cp = DB.capacitaciones.filter(c=>c.asistentes[id]).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const y = t.slice(0,4), mth = t.slice(0,7);
  const diasCM = (pref) => ca.reduce((n,c)=>{ let k=0; for(let f=c.inicio; f<=finCarpeta(c); f=addD(f,1)) if (f.startsWith(pref)) k++; return n+k; },0);
  const asis = Object.entries(DB.asistencia).filter(([k])=>k.startsWith(id+'|')).map(([k,v])=>({f:k.split('|')[1], ...v})).filter(x=>x.f.startsWith(y));
  const cuenta = {}; asis.forEach(a=>cuenta[a.cod]=(cuenta[a.cod]||0)+1);
  const horasCap = cp.filter(c=>['asistio','aprobado'].includes(c.asistentes[id])).reduce((n,c)=>n+(+c.horas||0),0);
  document.body.classList.add('modal-print');
  modal(`${printHead('Ficha individual')}
  <div class="row" style="justify-content:space-between"><h2 style="margin:0">${h(p.nombre)}</h2><div class="noprint"><button class="btn s" onclick="cerrarModal();editarPersona('${id}')">Editar datos</button> <button class="btn s d" onclick="imprimir()">Imprimir ficha</button> <button class="btn s" onclick="cerrarModal()">Cerrar</button></div></div>
  <p>Guardia <b>${p.guardia}</b> · ${h(p.cargo)||'Sin cargo'} · DNI/Legajo: ${h(p.dni)||'—'} · Tel: ${h(p.tel)||'—'} · Ingreso: ${fmt(p.ingreso)||'—'} · ${p.activo?'Activo':'Inactivo'}</p>
  ${p.obs?`<p class="muted">${h(p.obs)}</p>`:''}
  <div class="grid g4">
    <div class="stat"><div class="n">${minHM(s.min)}</div><div class="l">Horas extras acumuladas${p.saldoInicialMin?` (incluye ${minHM(p.saldoInicialMin)} de saldo inicial)`:''}</div></div>
    <div class="stat v"><div class="n">${s.disp}</div><div class="l">Francos disponibles (${s.ganados} ganados − ${s.tomados} tomados)</div></div>
    <div class="stat a"><div class="n">${minHM(s.resto)}</div><div class="l">Faltan para el próximo franco</div><div class="bar ${s.avance>=1200?'ok':''}"><div style="width:${s.avance/14.4}%"></div></div></div>
    <div class="stat r"><div class="n">${diasCM(mth)} / ${diasCM(y)}</div><div class="l">Días de carpeta médica (mes / año)</div></div>
  </div>
  <h3>Asistencia ${y}</h3><div>${Object.keys(cuenta).length?Object.entries(cuenta).map(([k,v])=>`<span class="tag" style="margin:2px">${h(k)}: ${v}</span>`).join(''):'<span class="muted">Sin registros.</span>'}</div>
  <h3>Formularios de horas extras (suman al saldo)</h3>
  ${hs.length?`<div class="tbl-wrap"><table class="tbl"><tr><th>Fecha</th><th>Tipo</th><th>Horario</th><th class="num">Tiempo</th><th>Motivo</th><th>N.º form.</th></tr>${hs.map(x=>`<tr class="${x.anulado?'anul':''}"><td>${fmt(x.fecha)}</td><td>${tipoHora(x.tipo)}</td><td>${horarioH(x)}</td><td class="num">${tiempoH(x)}</td><td>${h(x.motivo)}${x.anulado?` (ANULADO: ${h(x.motivoAnulacion)})`:''}</td><td>${h(x.nroForm)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Sin formularios.</p>'}
  <h3>Francos compensatorios tomados</h3>${fr.length?`<p>${fr.map(x=>`${fmt(x.fecha)}${x.forzado?' (forzado)':''}`).join(' · ')}</p>`:'<p class="muted">Ninguno.</p>'}
  <h3>Licencia anual</h3>${li.length?li.map(l=>{const c=licDe(l); return `<p><b>${h(l.periodo)}</b>: ${l.disponibles} disponibles · ${c.usados} usados · <b>${c.restantes} restantes</b><br>${l.franjas.map((f,i)=>`${i+1}.ª franja: ${fmt(f.desde)} – ${fmt(f.hasta)}`).join(' · ')}</p>`;}).join(''):'<p class="muted">Sin licencias cargadas.</p>'}
  <h3>Carpetas médicas</h3>${ca.length?`<div class="tbl-wrap"><table class="tbl"><tr><th>Desde</th><th>Hasta</th><th class="num">Días</th><th>Tipo</th><th>Certificado</th></tr>${ca.map(c=>`<tr><td>${fmt(c.inicio)}</td><td>${fmt(finCarpeta(c))}</td><td class="num">${c.dias}</td><td>${h(c.tipo)}</td><td>${c.presento?'Presentado':'<span class="tag r">Pendiente</span>'} ${h(c.nroCert)} ${badgeLM(c)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Ninguna.</p>'}

}

function abrirAsistencia(g, f){ UI.asis = {g, y:+f.slice(0,4), m:+f.slice(5,7)-1}; ir('asistencia'); }
function vAsistencia(){

function moverMes(d){ let {y,m} = UI.asis; m += d; if (m<0){m=11;y--;} if (m>11){m=0;y++;} UI.asis.y=y; UI.asis.m=m; render(); }
function initGrilla(){
  const plan = $('#plan'); if (!plan) return;
  plan.addEventListener('click', e => { const b = e.target.closest('.cel'); if (b && !b.disabled) detalleCelda(b.dataset.p, b.dataset.f); });
  plan.addEventListener('keydown', async e => {
    const b = e.target.closest('.cel'); if (!b || b.disabled) return;
    const cells = $$('#plan .cel'); const cols = $$('#plan thead tr:first-child th').length - 3;
    const i = cells.indexOf(b);
    const mv = {ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols}[e.key];
    if (mv){ e.preventDefault(); const n = cells[i+mv]; if (n) n.focus(); return; }
    if (e.key==='Enter'){ e.preventDefault(); detalleCelda(b.dataset.p, b.dataset.f); return; }
    if (e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); await setCodigo(b.dataset.p, b.dataset.f, ''); refocus(i); return; }
    const c = DB.config.codigos.find(c => c.tecla && c.tecla.toLowerCase()===e.key.toLowerCase());
    if (c && !e.ctrlKey && !e.metaKey){ e.preventDefault(); await setCodigo(b.dataset.p, b.dataset.f, c.sigla); if (c.sigla==='CG') detalleCelda(b.dataset.p,b.dataset.f); else refocus(i+cols); }
  });
}
function refocus(i){ const c = $$('#plan .cel'); (c[i] || c[c.length-1])?.focus(); }
async function setCodigo(pid, f, cod, extra = {}){
  const k = kAs(pid,f); const prev = DB.asistencia[k] || {};
  if (prev.cod==='FC' && cod!=='FC'){ DB.francos = DB.francos.filter(x => x.origen !== k); }
  if (cod==='FC' && prev.cod!=='FC'){
    const s = saldo(pid); let forz = false, just = '';
    if (s.disp < 1){
      just = await confirmar(`${nombreP(pid)} no tiene francos disponibles (le faltan ${minHM(s.resto)} para el próximo). ¿Registrar el franco igual?`, true);
      if (!just) return false; forz = true;
    }
    DB.francos.push({id:uid(), personaId:pid, fecha:f, obs:'Cargado desde la planilla de asistencia', forzado:forz, justif:just, origen:k});
  }
  if (cod==='CG' || prev.cod==='CG'){ DB.cambios = DB.cambios.filter(c => c.origen !== k); }
  if (!cod){ delete DB.asistencia[k]; }
  else {
    DB.asistencia[k] = {cod, nota: extra.nota ?? (prev.cod===cod?prev.nota:'') ?? '', conId: extra.conId ?? (cod==='CG'?prev.conId:'') ?? ''};
    if (cod==='CG' && DB.asistencia[k].conId) DB.cambios.push({id:uid(), personaId:pid, conId:DB.asistencia[k].conId, fecha:f, devolucion:extra.devolucion||'', devuelto:!!extra.devuelto, origen:k});
  }
  save(); render();
  if (cod==='CM' && !carpetaEn(pid,f)) toast(`${nombreP(pid)} figura con CM el ${fmt(f)} pero no tiene carpeta médica cargada.`, '', ['Cargar carpeta médica', ()=>editarCarpeta(null, {personaId:pid, inicio:f})]);
  return true;
}

function prevH(){

  const r = calcHoras(pid, f, de, ff, ha); e.style.display = 'block';
  if (!r){ e.className = 'err'; e.innerHTML = 'La salida es anterior o igual al ingreso.'; return; }

  e.innerHTML = `Tiempo total: <b>${minHM(r.total)}</b>${r.enGuardia ? ` · Dentro de su guardia: <b>${minHM(r.enGuardia)}</b> (no se cuenta)` : ''} · <span style="font-size:19px">Horas extras: <b>${minHM(r.extra)}</b></span>${pid?'':'<br><span class="muted">Elegí la persona para descontar su guardia.</span>'}${r.extra>1440?'<br>⚠ Son más de 24 h extras seguidas: revisá que las fechas sean correctas.':''}`;

async function guardarHora(){

  if (!r) return alert('La fecha y hora de salida tiene que ser posterior al ingreso.');

/* =====================================================
   9.b CÁLCULO DE HORAS EXTRAS
   Toma fecha y hora de ingreso y de salida (puede abarcar varios
   días) y descuenta las horas que caen dentro de la propia guardia
   de 24 h de la persona (de 08:00 a 08:00, configurable).
   No se descuenta si ese día figura con FC, LA, CM, ART o CG.
   ===================================================== */
const horaGuardia = () => DB.config.horaGuardia || '08:00';
function calcHoras(pid, fi, hi, ff, hf){
  if (!fi || !ff || hi==null || hf==null) return null;
  const t = (f, hm) => D(f).getTime() + hmToMin(hm)*60000;
  const a = t(fi,hi), b = t(ff,hf); if (!(b > a)) return null;
  const p = persona(pid); const hg = hmToMin(horaGuardia()); let enG = 0;
  if (p) for (let d = addD(fi,-1); d <= ff; d = addD(d,1)){
    if (guardiaEn(p,d) !== guardiaDelDia(d)) continue;
    const c = DB.asistencia[kAs(pid,d)]?.cod;
    if (['FC','LA','CM','ART','CG','—'].includes(c) || (!c && licenciaEn(pid,d))) continue;
    const s0 = D(d).getTime() + hg*60000, e0 = s0 + 1440*60000;
    enG += Math.max(0, Math.min(b,e0) - Math.max(a,s0));
  }
  const total = Math.round((b-a)/60000), g = Math.round(enG/60000);
  return {total, enGuardia:g, extra:total-g};
}
const horarioH = x => x.fechaHasta && x.fechaHasta !== x.fecha ? `${x.desde} → ${fmt(x.fechaHasta).slice(0,5)} ${x.hasta}` : (x.desde ? `${x.desde} a ${x.hasta}` : 'Cantidad cargada');
const tiempoH = x => minHM(x.min) + (x.guardiaMin ? `<br><small class="muted">(${minHM(x.totalMin)} − ${minHM(x.guardiaMin)} de guardia)</small>` : '');

async function leerTabla(file){

// --- Reconocimiento de columnas ---
const ROLES = [
  ['', '(ignorar)'], ['nombre','Apellido y nombre'], ['dni','DNI / Legajo'], ['disp','Días disponibles'], ['usados','Días usados'], ['rest','Días restantes'],
  ['guardia','Guardia'], ['franja','Franja (inicio - fin)'], ['desde','Fecha desde'], ['hasta','Fecha hasta'], ['periodo','Período / Año']

function rolDe(enc){
  const e = norm(enc);
  if (!e) return '';
  if (/franja|periodo de licencia|fechas/.test(e)){
    if (/desde/.test(e) || (/inicio/.test(e) && !/fin/.test(e))) return 'desde';
    if (/hasta/.test(e) || (/fin/.test(e) && !/inicio/.test(e))) return 'hasta';
    return 'franja';
  }
  if (/^(desde|inicio|fecha desde|fecha inicio)/.test(e) || /desde/.test(e)) return 'desde';
  if (/^(hasta|fin|fecha hasta|fecha fin)/.test(e) || /hasta/.test(e)) return 'hasta';
  if (/apellido|nombre|agente|efectivo/.test(e)) return 'nombre';
  if (/dni|legajo|documento/.test(e)) return 'dni';
  if (/^guardia$/.test(e)) return 'guardia';
  if (/restante|pendiente|saldo/.test(e)) return 'rest';
  if (/usad|tomad|gozad/.test(e)) return 'usados';
  if (/disponible|corresponde|dias|total/.test(e)) return 'disp';
  if (/ano|periodo/.test(e)) return 'periodo';
  return '';
}
function mapeoColumnas(tabla, archivo, periodo){
  let hi = tabla.slice(0,15).findIndex(r => r.filter(c=>rolDe(c)).length >= 2); if (hi < 0) hi = 0;

  ${tabla.slice(hi+1, hi+4).map(r=>`<tr>${enc.map((_,i)=>`<td>${h(r[i])}</td>`).join('')}</tr>`).join('')}</table></div>

}
function aplicarMapeo(){
  const {tabla, hi, archivo, periodo} = _map; const n = tabla[hi].length;
  const roles = Array.from({length:n},(_,i)=>val('map'+i));
  if (!roles.includes('nombre')) return alert('Indicá cuál es la columna de apellido y nombre');
  const filas = [];
  for (const r of tabla.slice(hi+1)){
    const o = {nombre:'', dni:'', disp:null, usados:null, rest:null, franjas:[], periodo:''}; const ds=[], hs=[];
    roles.forEach((rol,i)=>{ const v = r[i];
      if (rol==='nombre') o.nombre += ' ' + String(v||'');
      else if (rol==='dni') o.dni = String(v||'').trim();
      else if (rol==='guardia') o.guardia = String(v||'').toUpperCase().replace(/GUARDIA|\s|"/g,'');
      else if (['disp','usados','rest'].includes(rol)){ const x = parseFloat(String(v).replace(',','.')); if (!isNaN(x)) o[rol] = x; }
      else if (rol==='franja') o.franjas.push(...franjasDeTexto(v));
      else if (rol==='desde') ds.push(parseFecha(v)); else if (rol==='hasta') hs.push(parseFecha(v));
      else if (rol==='periodo') o.periodo = String(v||'').trim();

}
function franjasDeTexto(t){
  if (typeof t === 'number') return [];
  const fs = (String(t||'').match(/\d{1,2}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*\d{2,4}/g) || []).map(x=>parseFecha(x.replace(/\s/g,''))).filter(Boolean);

// --- Lectura de PDF (texto o, si es imagen, OCR) ---
async function leerPDF(file){
  await cargarLib(LIBS.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let palabras = [], texto = 0;

    const pg = await pdf.getPage(n); const vp = pg.getViewport({scale:1}); const tc = await pg.getTextContent();
    tc.items.forEach(it => { if (!it.str.trim()) return; texto += it.str.trim().length; palabras.push({t:it.str, x:it.transform[4], y:vp.height - it.transform[5], w:it.width, page:n, W:vp.width}); });
  }
  let ocr = false;
  if (texto < 40){
    const ok = await confirmar(`El PDF "${file.name}" no tiene texto (es una imagen). ¿Leerlo con reconocimiento de texto (OCR)? Puede tardar 1 o 2 minutos y necesita internet la primera vez.`);
    if (!ok) throw new Error('Importación cancelada. Si podés, exportá el cronograma a Excel o CSV.');
    palabras = await ocrPDF(pdf); ocr = true;
  }
  const filas = filasDesdePalabras(palabras);
  filas.forEach(f=>f.ocr = ocr);
  if (!filas.length) throw new Error('No encontré filas de licencias en el PDF. Probá exportarlo a Excel o CSV.');

}
async function ocrPDF(pdf){
  await cargarLib(LIBS.ocr);
  const worker = await Tesseract.createWorker('spa', 1, { logger: m => { if (m.status==='recognizing text') estadoImp(`<div class="warn">Reconociendo texto (OCR)… página ${window._ocrPag||1} de ${pdf.numPages}: ${Math.round(m.progress*100)}%</div>`); } });
  await worker.setParameters({ preserve_interword_spaces: '1' });
  const palabras = [];
  for (let n=1; n<=pdf.numPages; n++){
    window._ocrPag = n;
    const pg = await pdf.getPage(n); const vp = pg.getViewport({scale:2.5});
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await pg.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    const {data} = await worker.recognize(cv);
    (data.words||[]).forEach(w => { if (w.text.trim()) palabras.push({t:w.text, x:w.bbox.x0, y:(w.bbox.y0+w.bbox.y1)/2, w:w.bbox.x1-w.bbox.x0, page:n, W:vp.width}); });

  await worker.terminate();

}
/* Reconstruye la tabla a partir de la posición de cada palabra:

   2) cada número en la columna "Días disponibles" marca una fila;
   3) cada palabra se asigna a la fila más cercana y a su columna. Así se arman nombres y fechas cortados en dos renglones. */
function filasDesdePalabras(ws){
  const pags = [...new Set(ws.map(w=>w.page))].sort((a,b)=>a-b);
  let cols = null; const filas = [];

    const P = ws.filter(w=>w.page===pg);

    let headY = -Infinity;
    if (disp && us && re){
      const W = P[0].W, tol = W*0.015;
      // Las fechas empiezan donde dice "1ª"/"2ª", un poco antes de la palabra FRANJA
      const c3 = fr[0] ? Math.max(re.x + W*0.05, fr[0].x - W*0.04) : re.x + W*0.1;
      const c4 = fr[1] ? fr[1].x - W*0.04 : W;
      cols = [disp.x-tol, us.x-tol, re.x-tol, c3, c4];
      headY = Math.max(disp.y, us.y, re.y, ...(fr.map(f=>f.y)));
    }
    if (!cols) continue;
    const colDe = w => { let c = 0; cols.forEach((x,i)=>{ if (w.x >= x) c = i+1; }); return c; }; // 0 nombre,1 disp,2 usados,3 rest,4 franja1,5 franja2
    const cuerpo = P.filter(w=>w.y > headY + 2 && !/^(apellido|nombre|dias|y|\(inicio|inicio|fin\)|-?\s*fin\)?)$/.test(norm(w.t)) && !/^file|cronograma|listado de efectivos/i.test(w.t));
    const anclas = cuerpo.filter(w=>colDe(w)===1 && /^\d{1,3}$/.test(w.t.trim())).sort((a,b)=>a.y-b.y);
    if (!anclas.length) continue;
    const esp = anclas.length>1 ? anclas.slice(1).map((a,i)=>a.y-anclas[i].y).sort((a,b)=>a-b)[Math.floor((anclas.length-1)/2)] : 60;
    const grupos = anclas.map(a=>({a, ws:[]}));

      if (!nombre) continue;
      filas.push({ nombre, dni:'', disp: num(por[1]), usados: num(por[2]), rest: num(por[3]), franjas: [...franjasDeTexto(txt(por[4])), ...franjasDeTexto(txt(por[5]))], periodo:'' });
    }
  }

      const m = t.match(/^([A-Za-zÁÉÍÓÚÑáéíóúñ' .]+?)\s+(\d{1,3})\s+(\d{1,3})\s+(\d{1,3})\s+(.*)$/);
      if (m) filas.push({nombre:m[1].trim(), dni:'', disp:+m[2], usados:+m[3], rest:+m[4], franjas:franjasDeTexto(m[5]), periodo:''}); });

const claveNombre = s => norm(s).split(' ').filter(Boolean).sort().join(' ');
function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function cruzar(o){
  if (o.dni){ const p = DB.personal.find(p=>p.dni && norm(p.dni)===norm(o.dni)); if (p) return {estado:'ok', pid:p.id}; }
  const k = claveNombre(o.nombre);
  const ex = DB.personal.filter(p=>claveNombre(p.nombre)===k);
  if (ex.length===1) return {estado:'ok', pid:ex[0].id};
  const tk = k.split(' ');
  const cands = DB.personal.map(p=>{
    const pk = claveNombre(p.nombre).split(' ');
    let hit = 0; tk.forEach(t=>{ if (pk.some(x=>x===t || (t.length>=1 && x.startsWith(t)) || (x.length>=1 && t.startsWith(x)) || (t.length>3 && x.length>3 && lev(t,x)<=1))) hit++; });
    const sc = hit / Math.max(tk.length, pk.length);

function impSet(idx, k, v){

  if (k==='sel'){ if (v==='__nueva'){ it.accion='nueva'; it.pid=''; } else if (v==='__desc'){ it.accion='descartar'; } else { it.accion='importar'; it.pid=v; it.estado='ok'; } }
  else if (k==='disp') it.disp = v===''?null:+v;
  else if (k==='guardia') it.guardia = v;
  else if (k==='franjas') it.franjas = franjasDeTexto(v);
  dibujarPrevia();
}
async function confirmarImport(){
  const {items, archivo, periodo} = _imp;
  const reg = {id:uid(), fecha:new Date().toISOString(), archivo, periodo, cantidad:0, creadas:[], actualizadas:[], personas:[]};
  let desc = 0;
  // 1) altas nuevas
  items.forEach(it => { if (it.accion==='nueva'){ const ex = DB.personal.find(p=>claveNombre(p.nombre)===claveNombre(it.nombre)); if (ex) it.pid = ex.id; else { const p = nuevaPersona({nombre:it.nombre, guardia:it.guardia, dni:it.dni}); DB.personal.push(p); reg.personas.push(p.id); it.pid = p.id; } it.accion='importar'; } });
  // 2) agrupar filas de la misma persona (continuaciones)
  const grupos = {};
  items.forEach(it => { if (it.accion!=='importar' || !it.pid){ desc++; return; } const k = it.pid+'|'+it.periodo; if (!grupos[k]) grupos[k] = {pid:it.pid, periodo:it.periodo, disp:it.disp, franjas:[]}; grupos[k].franjas.push(...it.franjas); reg.cantidad++; });
  // 3) crear o actualizar
  Object.values(grupos).forEach(g => {
    const fr = g.franjas.filter(f=>f.desde&&f.hasta);
    const ex = DB.licencias.find(l=>l.personaId===g.pid && l.periodo===g.periodo);
    if (ex){ reg.actualizadas.push({id:ex.id, prev:JSON.parse(JSON.stringify(ex))}); ex.franjas = fr; if (g.disp!=null) ex.disponibles = g.disp; }
    else { const l = {id:uid(), personaId:g.pid, periodo:g.periodo, disponibles:g.disp??0, franjas:fr, obs:'Importado de '+archivo, importId:reg.id}; DB.licencias.push(l); reg.creadas.push(l.id); }
  });
  DB.importaciones.push(reg); UI.licPeriodo = periodo; save();
  const res = `${reg.creadas.length} importados, ${reg.actualizadas.length} actualizados, ${desc} descartados${reg.personas.length?`, ${reg.personas.length} personas nuevas`:''}.`;
  UI.licTab = 'listado'; render(); toast('Importación terminada: ' + res, 'ok');
}
async function deshacerImport(){
  const r = DB.importaciones.filter(i=>!i.modulo && !i.deshecha).pop(); if (!r) return;
  if (!(await confirmar(`¿Deshacer la importación de "${r.archivo}" del ${new Date(r.fecha).toLocaleString('es-AR')}?`))) return;
  DB.licencias = DB.licencias.filter(l=>!r.creadas.includes(l.id));
  r.actualizadas.forEach(u=>{ const i = DB.licencias.findIndex(l=>l.id===u.id); if (i>=0) DB.licencias[i] = u.prev; });
  DB.personal = DB.personal.filter(p=>!r.personas.includes(p.id) || DB.licencias.some(l=>l.personaId===p.id));
  r.deshecha = true; save(); render(); toast('Importación deshecha','ok');
}

/* ---------- Licencia médica: más de 10 días de carpeta (seguidos) ---------- */
const umbralLM = () => +DB.config.diasLicMedica || 10;
const ESTADOS_HOMO = ['Pendiente','Turno asignado','Homologada'];
function episodios(pid){ // carpetas seguidas (una empieza al día siguiente de que termina la otra) se suman
  const cs = DB.carpetas.filter(c=>c.personaId===pid).sort((a,b)=>a.inicio.localeCompare(b.inicio)); const eps = []; let cur = null;
  cs.forEach(c => { const f = finCarpeta(c); if (cur && c.inicio <= addD(cur.fin,1)){ cur.cs.push(c); if (f > cur.fin) cur.fin = f; } else { cur = {cs:[c], ini:c.inicio, fin:f}; eps.push(cur); } });
  eps.forEach(e => { e.dias = diffD(e.ini,e.fin)+1; e.lm = e.dias > umbralLM(); const hs = e.cs.map(c=>c.homo).filter(Boolean); e.homo = hs.sort((a,b)=>ESTADOS_HOMO.indexOf(b)-ESTADOS_HOMO.indexOf(a))[0] || (e.lm?'Pendiente':''); e.ref = e.cs.find(c=>c.homo) || e.cs[e.cs.length-1]; });
  return eps;
}
const episodioDe = c => episodios(c.personaId).find(e => e.cs.some(x=>x.id===c.id));
const lmPendientes = (ids) => DB.personal.filter(p=>!ids || ids.has(p.id)).flatMap(p => episodios(p.id).filter(e => e.lm && e.homo !== 'Homologada').map(e => ({p, e})));
function badgeLM(c){ const e = episodioDe(c); if (!e || !e.lm) return ''; return `<span class="tag r">Licencia médica · ${e.dias} días</span> <span class="tag ${e.homo==='Homologada'?'v':'a'}">Homologación: ${e.homo}${e.ref.homoFecha?' '+fmt(e.ref.homoFecha):''}</span>`; }

function mFin(){ const i = val('mi'), d = Math.max(1, +val('md')||1); if (!i) return; const f = addD(i, d-1); $('#mf').value = f; $('#mr').textContent = fmt(addD(f,1)); mLM(); }
function mDias(){ const i = val('mi'), f = val('mf'); if (i && f && f>=i){ $('#md').value = diffD(i,f)+1; $('#mr').textContent = fmt(addD(f,1)); } mLM(); }
function mLM(){ // calcula si con esta carpeta (y las seguidas) supera el límite
  const pid = val('mp'), i = val('mi'), d = Math.max(1, +val('md')||1), box = $('#mLM'); if (!box || !i) return;
  const otras = DB.carpetas.filter(c=>c.personaId===pid && c.id!==window._cEd);
  let ini = i, fin = addD(i, d-1), cambio = true;
  while (cambio){ cambio = false; otras.forEach(c => { const f = finCarpeta(c); if (c.inicio <= addD(fin,1) && f >= addD(ini,-1) && (c.inicio < ini || f > fin)){ if (c.inicio < ini) ini = c.inicio; if (f > fin) fin = f; cambio = true; } }); }
  const tot = diffD(ini, fin) + 1; const lm = tot > umbralLM();
  box.style.display = lm ? 'block' : 'none';

/* ---------- Gráficos SVG (sin librerías) ---------- */
function escala(max){ if (max<=0) return {top:1, paso:0.25}; const e = Math.pow(10, Math.floor(Math.log10(max/4))); const m = [1,2,2.5,5,10].find(k=>k*e*4>=max) || 10; const paso = m*e; return {top: paso*Math.ceil(max/paso), paso}; }
function rectSup(x,y,w,hh,r=4){ r = Math.min(r, w/2, hh); if (hh<=0) return ''; return `M${x},${y+hh} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+hh} Z`; }
function rectDer(x,y,w,hh,r=4){ r = Math.min(r, hh/2, w); if (w<=0) return ''; return `M${x},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+hh-r} Q${x+w},${y+hh} ${x+w-r},${y+hh} L${x},${y+hh} Z`; }
const tr = (s,n) => { s = String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; };
// Barras verticales: items [{l: etiqueta, v: valor, c: color}]
function gBarrasV(items, o={}){
  const W=o.w||380, H=o.h||210, L=40, R=8, T=22, B=34, fmtv=o.fmt||fN;
  if (!items.length || items.every(i=>!i.v)) return `<div class="h-vacio">Sin datos en el período.</div>`;
  const {top, paso} = escala(o.max ?? Math.max(...items.map(i=>i.v)));
  const pw=W-L-R, ph=H-T-B, st=pw/items.length, bw=Math.min(64, st*0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" font-family="system-ui,Segoe UI,Arial" font-size="11">`;
  for (let v=0; v<=top+1e-9; v+=paso){ const y = T+ph-(v/top)*ph; s += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${v===0?'#9a9994':GRID}" stroke-width="${v===0?1.2:1}"/><text x="${L-6}" y="${y+4}" text-anchor="end" fill="${TXT2}">${o.ejeFmt?o.ejeFmt(v):fN(v)}</text>`; }
  items.forEach((it,i)=>{ const x = L+st*i+(st-bw)/2, hh = (it.v/top)*ph, y = T+ph-hh;
    s += `<path d="${rectSup(x,y,bw,hh)}" fill="${it.c||COL_1}"><title>${esc(it.l)}: ${esc(fmtv(it.v))}</title></path>`;
    s += `<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" fill="${TXT1}" font-weight="700">${esc(fmtv(it.v))}</text>`;
    s += `<text x="${x+bw/2}" y="${H-B+15}" text-anchor="middle" fill="${TXT2}">${esc(tr(it.l, items.length>8?7:16))}</text>`; });
  return s + '</svg>';
}
// Barras horizontales: ranking
function gBarrasH(items, o={}){
  const fmtv=o.fmt||fN, W=o.w||600, row=W<500?24:22, L=o.L||(W<500?140:190), R=W<500?52:70, T=4;
  if (!items.length || items.every(i=>!i.v)) return `<div class="h-vacio">Sin datos en el período.</div>`;
  const max = Math.max(...items.map(i=>i.v)); const H = T*2 + row*items.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" font-family="system-ui,Segoe UI,Arial" font-size="11">`;
  s += `<line x1="${L}" x2="${L}" y1="0" y2="${H}" stroke="#9a9994"/>`;
  items.forEach((it,i)=>{ const y = T+row*i, w = max ? (it.v/max)*(W-L-R) : 0;
    s += `<text x="${L-8}" y="${y+row/2+4}" text-anchor="end" fill="${TXT1}">${esc(tr(it.l, Math.floor(L/6.3)))}</text>`;
    s += `<path d="${rectDer(L,y+4,w,row-8)}" fill="${it.c||COL_1}"><title>${esc(it.l)}: ${esc(fmtv(it.v))}</title></path>`;
    s += `<text x="${L+w+6}" y="${y+row/2+4}" fill="${TXT1}" font-weight="700">${esc(fmtv(it.v))}</text>`; });
  return s + '</svg>';
}
// Líneas: etiquetas en X y una serie por guardia (con etiqueta directa al final)
function gLineas(labels, series, o={}){
  const W=o.w||380, H=o.h||210, L=40, R=62, T=16, B=30, fmtv=o.fmt||fN;
  const all = series.flatMap(s=>s.values);
  if (!labels.length || all.every(v=>!v)) return `<div class="h-vacio">Sin datos en el período.</div>`;
  const {top, paso} = escala(Math.max(...all));
  const pw=W-L-R, ph=H-T-B, X = i => L + (labels.length===1 ? pw/2 : pw*i/(labels.length-1)), Y = v => T+ph-(v/top)*ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" font-family="system-ui,Segoe UI,Arial" font-size="11">`;
  for (let v=0; v<=top+1e-9; v+=paso){ const y=Y(v); s += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${v===0?'#9a9994':GRID}"/><text x="${L-6}" y="${y+4}" text-anchor="end" fill="${TXT2}">${o.ejeFmt?o.ejeFmt(v):fN(v)}</text>`; }
  const salto = Math.ceil(labels.length/(W<500?6:12));
  labels.forEach((l,i)=>{ if (i%salto===0) s += `<text x="${X(i)}" y="${H-B+16}" text-anchor="middle" fill="${TXT2}">${esc(l)}</text>`; });
  const fin = series.map(se=>({se, y:Y(se.values[se.values.length-1])})).sort((a,b)=>a.y-b.y);
  for (let i=1;i<fin.length;i++) if (fin[i].y - fin[i-1].y < 13) fin[i].y = fin[i-1].y + 13;
  series.forEach(se=>{
    s += `<polyline fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round" points="${se.values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}"/>`;
    se.values.forEach((v,i)=>{ s += `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${se.c}" stroke="#fff" stroke-width="2"><title>${esc(se.n)} – ${esc(labels[i])}: ${esc(fmtv(v))}</title></circle>`; });
  });
  fin.forEach(({se,y})=>{ s += `<text x="${W-R+8}" y="${y+4}" fill="${TXT1}" font-weight="700">${esc(se.n)}</text>`; });
  return s + '</svg>';
}
const leyendaG = gs => gs.length>1 ? `<div class="h-leg">${gs.map(g=>`<span><i style="background:${COL_G[g]}"></i>Guardia ${g}</span>`).join('')}</div>` : '';

/* ---------- Cálculo de datos por módulo ---------- */
function datAsis(ps, d, hh){
  const ids = new Set(ps.map(p=>p.id)); const r = {}; ps.forEach(p=>r[p.id]={});
  for (const [k,v] of Object.entries(DB.asistencia)){ const i = k.indexOf('|'); const pid = k.slice(0,i), f = k.slice(i+1); if (ids.has(pid) && f>=d && f<=hh && v.cod) r[pid][v.cod] = (r[pid][v.cod]||0)+1; }
  const resumenP = pid => { const o = r[pid]; const reg = Object.entries(o).filter(([k])=>k!=='—').reduce((n,[,v])=>n+v,0); const P = o.P||0; const aus = ['FC','CM','LA','ART'].reduce((n,k)=>n+(o[k]||0),0); return {reg, P, aus, pres: pct(P,reg)}; };
  return {r, resumenP};
}

function datCaps(d, hh){ return DB.capacitaciones.filter(c=>c.fecha>=d && c.fecha<=hh).sort((a,b)=>a.fecha.localeCompare(b.fecha)); }
const asistio = (c, pid) => ['asistio','aprobado'].includes(c.asistentes[pid]);

/* ---------- Informes por módulo ---------- */
function infAsistencia(c, ps){
  const {r, resumenP} = datAsis(ps, c.desde, c.hasta); const gs = gsDe(c, ps);
  const tot = ps.reduce((o,p)=>{ const x = resumenP(p.id); o.reg+=x.reg; o.P+=x.P; o.aus+=x.aus; return o; }, {reg:0,P:0,aus:0});
  const porTipo = {}; ps.forEach(p=>Object.entries(r[p.id]).forEach(([k,v])=>{ if (!['P','—'].includes(k)) porTipo[k]=(porTipo[k]||0)+v; }));
  const porG = gs.map(g=>{ const pg = ps.filter(p=>p.guardia===g); const t = pg.reduce((o,p)=>{ const x=resumenP(p.id); o.reg+=x.reg; o.P+=x.P; o.aus+=x.aus; return o; },{reg:0,P:0,aus:0}); return {g, ...t, pres:pct(t.P,t.reg), n:pg.length}; });
  const rank = ps.map(p=>({p, ...resumenP(p.id)})).filter(x=>x.aus>0).sort((a,b)=>b.aus-a.aus).slice(0,10);
  const peorG = porG.filter(x=>x.reg).sort((a,b)=>a.pres-b.pres)[0];
  const tipoTop = Object.entries(porTipo).sort((a,b)=>b[1]-a[1])[0];
  if (!tot.reg) return sec('Resumen', resumen(['No hay asistencia cargada en la planilla para este período y alcance.']));

    peorG && porG.length>1 ? `La guardia con menor presentismo es la <b>Guardia ${peorG.g}</b> (${fP(peorG.pres)}).` : '',

  ]))
  + sec('Indicadores', kpis([[fP(pct(tot.P,tot.reg)),'Presentismo'],[tot.P,'Presentes (P)'],[tot.aus,'Ausencias (FC, CM, LA, ART)'],[tot.reg,'Casillas registradas']]))
  + sec('Gráficos', `<div class="h-dos">${porG.length>1?graf('Presentismo por guardia','Porcentaje de casillas con "P"', gBarrasV(porG.map(x=>({l:'Guardia '+x.g, v:x.pres, c:COL_G[x.g]})), {fmt:fP, max:100, ejeFmt:v=>v+' %'})):''}
      ${graf('Situaciones registradas (sin contar "Presente")','Cantidad de casillas por código', gBarrasH(Object.entries(porTipo).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({l:`${k} – ${codigo(k)?.nombre||''}`, v})), {w:380, L:170}))}</div>
      ${rank.length?graf('Personas con más ausencias','Top 10 – FC, CM, LA y ART', gBarrasH(rank.map(x=>({l:x.p.nombre, v:x.aus, c:COL_G[x.p.guardia]}))), leyendaG(gs)):''}`)
  + sec('Detalle por persona', tablaH(['Apellido y nombre','G','P','FC','CM','LA','ART','CG','Otras','Presentismo'],
      ps.map(p=>{ const o=r[p.id], x=resumenP(p.id); const otras = Object.entries(o).filter(([k])=>!['P','FC','CM','LA','ART','CG','—'].includes(k)).reduce((n,[,v])=>n+v,0); return [esc(p.nombre),p.guardia,o.P||'',o.FC||'',o.CM||'',o.LA||'',o.ART||'',o.CG||'',otras||'',x.reg?fP(x.pres):'—']; }), {num:[2,3,4,5,6,7,8,9]}))
  + `<div class="h-def">Presentismo = casillas "P" sobre casillas registradas en la planilla (sin contar "No corresponde").</div>`;
}
function infHoras(c, ps){

      ${meses.length>1?graf('Evolución mensual','Horas extras por mes', porG.length>1 ? gLineas(meses.map(mesCorto), porG.map(x=>({n:'Guardia '+x.g, c:COL_G[x.g], values:serieMes(h_=>persona(h_.personaId)?.guardia===x.g)})), {fmt:v=>fN(v)+' h'}) : gBarrasV(meses.map((k,i)=>({l:mesCorto(k), v:serieMes(()=>true)[i]})), {fmt:v=>fN(v)+' h'}), porG.length>1?leyendaG(gs):''):''}</div>
      ${rank.length?graf('Personas con más horas extras','Top 10 del período', gBarrasH(rank.map(([pid,m])=>({l:nombreP(pid), v:m/60, c:COL_G[persona(pid)?.guardia]})), {fmt:v=>fN(v)+' h'}), leyendaG(gs)):''}`)

/* =====================================================
   19. LECTURA Y ESCRITURA DE ARCHIVOS SIN INTERNET
   Excel (.xlsx) y Word (.docx) son archivos ZIP: se abren con
   el descompresor que trae el navegador. Solo .xls (viejo) y el
   reconocimiento de texto de PDF escaneados necesitan internet.
   ===================================================== */
async function unzip(buf){
  const dv = new DataView(buf);
  let e = buf.byteLength - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('El archivo está dañado o no es un .xlsx / .docx válido.');
  const n = dv.getUint16(e+10, true); let p = dv.getUint32(e+16, true); const files = {};
  for (let i=0; i<n; i++){
    const comp = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true), nl = dv.getUint16(p+28,true), xl = dv.getUint16(p+30,true), cl = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
    files[new TextDecoder().decode(new Uint8Array(buf, p+46, nl))] = {comp, csize, off}; p += 46+nl+xl+cl;
  }
  return { async text(k){ const f = files[k]; if (!f) return null;
    const data = new Uint8Array(buf, f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true), f.csize);
    if (f.comp === 0) return new TextDecoder().decode(data);
    if (f.comp === 8){ if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador es muy viejo para abrir el archivo. Actualizá Chrome o Edge.'); return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); }
    throw new Error('Formato de compresión no soportado.'); } };
}
const xmlDoc = s => new DOMParser().parseFromString(s, 'application/xml');

function excelFecha(n){
  if (n < 1){ const m = Math.round(n*1440); return `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
  const ms = Math.round(n*MS); const f = fmt(iso(new Date(Date.UTC(1899,11,30) + Math.floor(n)*MS)));
  const fr = n - Math.floor(n); if (fr > 0.0001){ const m = Math.round(fr*1440); return `${f} ${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
  return f;
}

    const r = Array.from(xmlDoc(await z.text('xl/_rels/workbook.xml.rels')).getElementsByTagName('Relationship')).find(x=>x.getAttribute('Id')===rid);

async function leerDOCX(buf){

// PDF genérico: arma filas y columnas según la posición del texto
async function leerPDFGenerico(file, roles){
  await cargarLib(LIBS.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let ws = [], texto = 0;
  for (let n=1; n<=pdf.numPages; n++){ const pg = await pdf.getPage(n); const vp = pg.getViewport({scale:1}); const tc = await pg.getTextContent();
    tc.items.forEach(it => { if (!it.str.trim()) return; texto += it.str.trim().length; ws.push({t:it.str.trim(), x:it.transform[4], y:vp.height-it.transform[5], w:it.width, h:Math.abs(it.transform[3])||10, page:n, W:vp.width}); }); }
  let ocr = false;
  if (texto < 40){
    if (!(await confirmar('El PDF no tiene texto (es una imagen o un escaneo). ¿Leerlo con reconocimiento de texto (OCR)? Tarda 1 o 2 minutos, necesita internet la primera vez y puede equivocarse.'))) throw new Error('Importación cancelada.');
    ws = (await ocrPDF(pdf)).map(w => ({...w, h: 24})); ocr = true;
  }
  const lineas = [];
  ws.sort((a,b)=>a.page-b.page || a.y-b.y || a.x-b.x).forEach(w => { const l = lineas[lineas.length-1]; if (l && l.page===w.page && Math.abs(l.y-w.y) < Math.max(4, w.h*0.55)) l.ws.push(w); else lineas.push({page:w.page, y:w.y, ws:[w]}); });
  let hi = lineas.findIndex(l => l.ws.filter(w => roles(w.t)).length >= 2);
  if (hi < 0) hi = 0;
  const head = lineas[hi].ws.sort((a,b)=>a.x-b.x); const W0 = head[0]?.W || 600;
  const celdas = []; head.forEach(w => { const c = celdas[celdas.length-1]; if (c && w.x - (c.x2) < W0*0.012) { c.t += ' ' + w.t; c.x2 = w.x + w.w; } else celdas.push({t:w.t, x:w.x, x2:w.x+w.w}); });
  const ini = celdas.map(c => c.x - W0*0.01);
  const filas = [celdas.map(c => c.t)];
  lineas.slice(hi+1).forEach(l => {
    if (l.ws.map(w=>w.t).join(' ') === filas[0].join(' ')) return;
    const r = celdas.map(() => ''); l.ws.sort((a,b)=>a.x-b.x).forEach(w => { let c = 0; ini.forEach((x,i)=>{ if (w.x + 1 >= x) c = i; }); r[c] = (r[c] ? r[c]+' ' : '') + w.t; });
    const prev = filas[filas.length-1];
    if (filas.length > 1 && r.filter(Boolean).length === 1 && r[0] && !/\d/.test(r[0])) prev[0] += ' ' + r[0]; // nombre cortado en dos renglones
    else filas.push(r);
  });
  return {filas, ocr};
}
async function leerArchivoTabla(file, roles){
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext==='csv' || ext==='txt') return {filas: parseCSV(await file.text())};
  if (ext==='xlsx' || ext==='xlsm'){ try{ return {filas: await leerXLSX(await file.arrayBuffer())}; }catch(e){ console.warn(e); } }
  if (ext==='xlsx' || ext==='xls' || ext==='xlsm' || ext==='ods'){ await cargarLib(LIBS.xlsx); const wb = XLSX.read(await file.arrayBuffer(), {type:'array'}); return {filas: XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''}).filter(r=>r.some(x=>String(x).trim()))}; }
  if (ext==='docx') return {filas: await leerDOCX(await file.arrayBuffer())};
  if (ext==='doc') throw new Error('Los archivos .doc (Word viejo) no se pueden leer. Abrilo en Word y elegí "Guardar como" → Documento de Word (.docx).');
  if (ext==='pdf') return await leerPDFGenerico(file, roles);
  throw new Error('Formato no reconocido. Usá Excel, CSV, Word (.docx) o PDF.');
}

function crc32(u8){ let crc = 0xFFFFFFFF; for (let i=0;i<u8.length;i++){ let c = (crc ^ u8[i]) & 0xFF; for (let k=0;k<8;k++) c = c & 1 ? (c>>>1) ^ 0xEDB88320 : c>>>1; crc = (crc>>>8) ^ c; } return (crc ^ 0xFFFFFFFF) >>> 0; }
function zipBlob(files){
  const enc = new TextEncoder(); const partes = [], central = []; let off = 0;

    const nb = enc.encode(name), data = enc.encode(txt), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(8,0,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nb.length,true);
    partes.push(new Uint8Array(lh.buffer), nb, data);
    const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nb.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), nb); off += 30 + nb.length + data.length;
  }
  const csize = central.reduce((n,a)=>n+a.length,0); const e = new DataView(new ArrayBuffer(22));

const parseHora = v => {
  if (v == null || v === '') return null;
  if (typeof v === 'number'){ if (v < 1) return excelFecha(v); if (v < 24) return `${String(Math.floor(v)).padStart(2,'0')}:${String(Math.round((v%1)*60)).padStart(2,'0')}`; return null; }

  if (!m) return null; const hh = +m[1], mm = +(m[2]||0); if (hh>23 || mm>59) return null;
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
};

    ${_gi.items.map((it,idx)=>`<tr class="${{v:'prev-ok',a:'prev-a',r:'prev-r',d:'prev-d'}[it.col]}"><td><span class="tag ${it.col==='d'?'':it.col}">${{v:'✅ OK',a:'⚠️ Revisar',r:'➕ Nueva',d:'—'}[it.col]}</span></td><td><b>${h(it.v.nombre)}</b></td>
      <td><select onchange="giSetG(${idx},this.value)" style="max-width:240px"><option value="__nueva" ${it.accion==='nueva'?'selected':''}>➕ Dar de alta como nueva</option><option value="__desc" ${it.accion==='descartar'?'selected':''}>🗑 Descartar fila</option>
      ${DB.personal.slice().sort((x,y)=>x.nombre.localeCompare(y.nombre)).map(p=>`<option value="${p.id}" ${it.accion==='importar'&&it.pid===p.id?'selected':''}>${h(p.nombre)} (Guardia ${p.guardia})</option>`).join('')}</select></td><td style="font-size:13px">${it.notas.join('<br>')}</td></tr>`).join('')}</tbody></table></div>
    <div class="acc"><button class="btn" onclick="giArea('')">Cancelar</button><button class="btn p" onclick="giConfirmar()">Confirmar importación</button></div></div>`);
}
function giSetG(idx, v){ const it = _gi.items[idx]; if (v==='__nueva'){ it.accion='nueva'; it.pid=''; } else if (v==='__desc') it.accion='descartar'; else { it.accion='importar'; it.pid=v; it.estado='ok'; } giPreviaGrilla(); }
// --- Guardar lo importado ---
function giConfirmar(){
  const mod = _gi.mod; const reg = {id:uid(), fecha:new Date().toISOString(), modulo:mod, archivo:_gi.archivo, cantidad:0, creados:[], actualizados:[], personas:[], asis:[]};
  const sob = $('#giSob')?.checked;
  const crear = (col, obj) => { obj.id = obj.id || uid(); obj.importId = reg.id; DB[col].push(obj); reg.creados.push({col, id:obj.id}); return obj; };
  const personaDe = it => {
    if (it.accion==='importar' && it.pid) return persona(it.pid);
    if (it.accion!=='nueva' || !it.v.nombre) return null;
    const ex = DB.personal.find(p=>claveNombre(p.nombre)===claveNombre(it.v.nombre)); if (ex) return ex;
    const g = mod==='personal' && it.g ? it.g : it.guardia;
    const p = nuevaPersona({nombre:it.v.nombre, guardia:g, dni:it.v.dni?String(it.v.dni):''}); DB.personal.push(p); reg.personas.push(p.id); return p;
  };
  let ok = 0, salt = 0;
  _gi.items.forEach(it => {
    if (it.accion==='descartar' || it.dup || it.err || it.col==='d'){ salt++; return; }
    const p = personaDe(it); if (!p){ salt++; return; }
    const v = it.v;
    if (mod==='personal'){
      if (reg.personas.includes(p.id)){ Object.assign(p, {cargo:v.cargo?String(v.cargo).trim():'', tel:v.tel?String(v.tel).trim():'', ingreso:fechaDe(v.ingreso)||''}); }
      else { reg.actualizados.push({col:'personal', id:p.id, prev:JSON.parse(JSON.stringify(p))});
        if (v.dni) p.dni = String(v.dni).trim(); if (v.cargo) p.cargo = String(v.cargo).trim(); if (v.tel) p.tel = String(v.tel).trim(); if (fechaDe(v.ingreso)) p.ingreso = fechaDe(v.ingreso);
        if (GUARDIAS.includes(it.g) && it.g !== p.guardia){ p.historialGuardia = p.historialGuardia || [{guardia:p.guardia, desde:'2000-01-01'}]; p.historialGuardia.push({guardia:it.g, desde:hoy()}); p.guardia = it.g; } }
    }
    if (mod==='horas' && it.calc){ const c = it.calc; crear('horas', {personaId:p.id, fecha:c.fecha, fechaHasta:c.fechaHasta, tipo: /ingres|anticip/i.test(v.tipo||'')?'ingreso':/otro/i.test(v.tipo||'')?'otro':'retiro', desde:c.desde, hasta:c.hasta, min:c.extra, totalMin:c.total, guardiaMin:c.enGuardia, motivo:String(v.motivo||'').trim(), autorizo:String(v.autorizo||'').trim(), nroForm:v.nroForm!=null?String(v.nroForm):'', anulado:false}); }
    if (mod==='francos' && it.fecha){ const k = kAs(p.id, it.fecha); const enPl = guardiaEn(p,it.fecha)===guardiaDelDia(it.fecha) && !DB.asistencia[k];
      crear('francos', {personaId:p.id, fecha:it.fecha, obs:String(v.obs||'Importado'), forzado:!!it.sinSaldo, justif: it.sinSaldo?'Importado de planilla sin saldo':'', origen: enPl ? k : undefined});
      if (enPl){ reg.asis.push({k, prev:null}); DB.asistencia[k] = {cod:'FC', nota:''}; } }
    if (mod==='carpetas' && it.calc){ const c = crear('carpetas', {personaId:p.id, ...it.calc}); if (c.dias > umbralLM()) c.homo = 'Pendiente'; }
    if (mod==='capacitaciones' && it.calc){ const c0 = it.calc;
      let cap = DB.capacitaciones.find(c=>norm(c.tema)===norm(c0.tema) && c.fecha===c0.fecha);
      if (!cap) cap = crear('capacitaciones', {tema:c0.tema, fecha:c0.fecha, horas:c0.horas, instructor:String(v.instructor||''), lugar:String(v.lugar||''), modalidad:/virt/i.test(v.modalidad||'')?'Virtual':'Presencial', certificado:false, obligatoria:false, asistentes:{}});
      else if (!reg.actualizados.some(u=>u.id===cap.id) && !reg.creados.some(u=>u.id===cap.id)) reg.actualizados.push({col:'capacitaciones', id:cap.id, prev:JSON.parse(JSON.stringify(cap))});
      if (p) cap.asistentes[p.id] = c0.estado; }
    if (mod==='asistencia'){
      Object.entries(it.celdas||{}).forEach(([f, cod]) => {
        const k = kAs(p.id, f); const prev = DB.asistencia[k];
        if (prev?.cod && !sob) return;
        reg.asis.push({k, prev: prev ? {...prev} : null});
        if (prev?.cod==='FC' && cod!=='FC'){ const fr = DB.francos.find(x=>x.origen===k); if (fr){ reg.actualizados.push({col:'francos', id:fr.id, prev:{...fr}, borrado:true}); DB.francos = DB.francos.filter(x=>x!==fr); } }
        DB.asistencia[k] = {cod, nota:'', importId:reg.id};
        if (cod==='FC' && prev?.cod!=='FC'){ const s = saldo(p.id); crear('francos', {personaId:p.id, fecha:f, obs:'Importado de la planilla de asistencia', forzado: s.disp<1, justif: s.disp<1?'Importado de planilla sin saldo':'', origen:k}); }
      });
    }
    ok++;
  });
  reg.cantidad = ok;
  DB.importaciones.push(reg); save(); cerrarModal(); render();
  toast(`Importación terminada: ${ok} fila(s) cargadas${salt?`, ${salt} no se cargaron`:''}${reg.personas.length?`, ${reg.personas.length} persona(s) nuevas`:''}.`, 'ok');
}
async function deshacerGen(mod){
  const r = DB.importaciones.filter(i=>i.modulo===mod && !i.deshecha).pop(); if (!r) return;
  if (!(await confirmar(`¿Deshacer la importación de "${r.archivo}" del ${new Date(r.fecha).toLocaleString('es-AR')}?`))) return;
  r.creados.forEach(({col,id}) => DB[col] = DB[col].filter(x=>x.id!==id));
  r.actualizados.forEach(u => { if (u.borrado){ DB[u.col].push(u.prev); return; } const i = DB[u.col].findIndex(x=>x.id===u.id); if (i>=0) DB[u.col][i] = u.prev; });
  r.asis.slice().reverse().forEach(({k,prev}) => { if (prev) DB.asistencia[k] = prev; else delete DB.asistencia[k]; });
  DB.personal = DB.personal.filter(p => !r.personas.includes(p.id));
  r.deshecha = true; save(); cerrarModal(); render(); toast('Importación deshecha','ok');
}
const btnImport = mod => `<button class="btn" onclick="abrirImport('${mod}')">📥 Importar archivo</button>`;

   18. ARRANQUE
   ===================================================== */
(async function init(){
  await Store.open();
  const d = await Store.get('data');
  DB = d ? migrar(d) : datosIniciales();
  if (!d) save();
  menu(); render(); botonTema();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
